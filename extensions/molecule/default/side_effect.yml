# The rest of an app's life: a dropped file, private files renamed and removed, a change of
# kind, secrets rotated, decommissioning. Each stage asserts right after the role runs,
# because its state is the next stage's input.
- name: Side effect
  hosts: all
  become: true
  gather_facts: false

  vars:
    molecule_fixture_apps:
      # The kind each app is in by teardown; molsource has been flipped to inline by then.
      - {name: molinline, kind: inline}
      - {name: molsource, kind: inline}
      - {name: molnet, kind: source}
      - {name: molsecret, kind: inline}
      # Deployed with systemd_app_enable_units and decommissioned without: the case a teardown
      # driven only by the caller's unit names cannot stop.
      - {name: molorphan, kind: source}
      # Never started by the role at all, only by hand in the stage below.
      - {name: molquiet, kind: source}
      # Refused before anything reached the host, so decommissioning it must stay green.
      - {name: molclaim, kind: inline}

  tasks:
    # --- a file dropped from the app's source tree -------------------------------------
    - name: Drop a config file from the fixture app tree
      ansible.builtin.file:
        path: "{{ molecule_apps_dir }}/molsource/config/nested/deep.conf"
        state: absent
      delegate_to: localhost
      become: false

    - name: Re-deploy the source app without that file
      ansible.builtin.include_role:
        name: binarycodes.homelab.systemd_app
      vars:
        systemd_app_kind: source
        systemd_app_name: molsource
        systemd_app_enable_units:
          - molsource.service
          - molsource-extra.service
        systemd_app_domain: molsource.molecule.test

    - name: Stat the pruned and the kept config file
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /var/app/molsource/config/nested/deep.conf
        - /var/app/molsource/config/app.conf
      register: molecule_after_prune

    - name: Read the manifest recorded by the re-deploy
      ansible.builtin.slurp:
        src: /var/app/molsource/.install-manifest
      register: molecule_pruned_manifest

    - name: Ask systemd for the state of the source app after the prune
      ansible.builtin.command:
        argv: [systemctl, is-active, molsource.service]
      changed_when: false
      register: molecule_pruned_unit

    - name: Assert the dropped file was removed and recorded as gone
      ansible.builtin.assert:
        that:
          - not molecule_after_prune.results[0].stat.exists
          # Only what this deploy stopped installing goes: the rest of the tree stays.
          - molecule_after_prune.results[1].stat.exists
          - "'/var/app/molsource/config/nested/deep.conf' not in molecule_recorded"
          - "'/var/app/molsource/config/app.conf' in molecule_recorded"
          # A config change reaches a running app without the file's own unit being
          # reinstalled, so the app must still be up.
          - molecule_pruned_unit.stdout == 'active'
        quiet: true
      vars:
        molecule_recorded: "{{ (molecule_pruned_manifest.content | b64decode).splitlines() }}"

    # --- private files: renamed, then dropped altogether ---------------------------------
    # The encrypted copy is pruned like any installed file, but the plaintext is in a
    # RuntimeDirectory only the decrypt unit owns, so the old name leaves /run only if that
    # unit was restarted.
    - name: Rename a private file in the fixture app tree
      ansible.builtin.command:
        argv:
          - mv
          - "{{ molecule_apps_dir }}/molsource/private/db.env.age"
          - "{{ molecule_apps_dir }}/molsource/private/db-new.env.age"
      changed_when: true
      delegate_to: localhost
      become: false

    - name: Re-deploy the source app over the renamed private file
      ansible.builtin.include_role:
        name: binarycodes.homelab.systemd_app
      vars:
        systemd_app_kind: source
        systemd_app_name: molsource
        systemd_app_enable_units:
          - molsource.service
          - molsource-extra.service
        systemd_app_domain: molsource.molecule.test

    - name: Stat the private files before and after the rename
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /var/app/molsource/private/db.env.age
        - /var/app/molsource/private/db-new.env.age
        - /run/app/molsource/private/db.env
        - /run/app/molsource/private/db-new.env
        # Untouched by the rename.
        - /run/app/molsource/private/nested/conf.yaml
      register: molecule_after_rename

    - name: Assert the old name went from the host and from the runtime tree
      ansible.builtin.assert:
        that:
          - not molecule_after_rename.results[0].stat.exists
          - molecule_after_rename.results[1].stat.exists
          # The tmpfs tree was rebuilt, not left holding a file the app no longer ships.
          - not molecule_after_rename.results[2].stat.exists
          - molecule_after_rename.results[3].stat.exists
          - molecule_after_rename.results[4].stat.exists
        fail_msg: >-
          After the rename:
          {{ molecule_after_rename.results | map(attribute='item')
             | zip(molecule_after_rename.results | map(attribute='stat.exists')) | list }}.
        quiet: true

    - name: Drop the private directory from the fixture app tree
      ansible.builtin.file:
        path: "{{ molecule_apps_dir }}/molsource/private"
        state: absent
      delegate_to: localhost
      become: false

    - name: Re-deploy the source app with no private files at all
      ansible.builtin.include_role:
        name: binarycodes.homelab.systemd_app
      vars:
        systemd_app_kind: source
        systemd_app_name: molsource
        systemd_app_enable_units:
          - molsource.service
          - molsource-extra.service
        systemd_app_domain: molsource.molecule.test

    - name: Stat what an app that stopped shipping private files must not keep
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /var/app/molsource/private/db-new.env.age
        # The files, then the directories they emptied.
        - /var/app/molsource/private/nested
        - /var/app/molsource/private
        - /etc/systemd/system/molsource.service.d/10-private.conf
        - /etc/systemd/system/molsource.service.d
        - /etc/systemd/system/molsource-extra.service.d
        - /run/app/molsource/private
        - /run/app/molsource
        # Another app's files are none of this app's business.
        - /run/app/molinline/private/tls.key
        - /etc/systemd/system/homelab-private-decrypt@.service
      register: molecule_after_drop

    - name: Ask systemd for the state of the app and of its decrypt instance
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ item }}"]
      loop:
        - molsource.service
        - homelab-private-decrypt@molsource.service
        - homelab-private-decrypt@molinline.service
      changed_when: false
      failed_when: false
      register: molecule_after_drop_units

    - name: Assert the app kept nothing private, and no other app was touched
      ansible.builtin.assert:
        that:
          - molecule_after_drop.results[:8] | rejectattr('stat.exists') | list | length == 8
          # One app losing its private files must not disturb any other.
          - molecule_after_drop.results[8].stat.exists
          - molecule_after_drop.results[9].stat.exists
          - molecule_after_drop_units.results[0].stdout == 'active'
          # Stopping it is what took the tmpfs tree away.
          - molecule_after_drop_units.results[1].stdout != 'active'
          - molecule_after_drop_units.results[2].stdout == 'active'
        fail_msg: >-
          Left behind:
          {{ molecule_after_drop.results | selectattr('stat.exists')
             | map(attribute='item') | list }}; units
          {{ molecule_after_drop_units.results | map(attribute='stdout') | list }}.
        quiet: true

    # --- an app the role never starts: brought up by hand, then a private file rotated ----
    # Nothing so far has started molquiet, because its call names no systemd_app_enable_units.
    # Starting it by hand is what an operator does with a 'source' app, and it is the only way
    # to reach what the decrypt's try-restart is for: an instance that IS running when the next
    # deploy changes a private file. Requires= is what pulls the decrypt in here; the role is
    # not involved.
    - name: Start the app the converge left alone
      ansible.builtin.systemd:
        name: molquiet.service
        state: started

    - name: Ask the hand-started container to read its private file
      ansible.builtin.command:
        argv: [podman, exec, molquiet, cat, /etc/molquiet/token]
      changed_when: false
      register: molecule_quiet_first

    - name: Re-encrypt the quiet app's private file with a new value
      ansible.builtin.command:
        argv:
          - age
          - --encrypt
          - --recipient
          - "{{ molecule_sops_recipient }}"
          - --output
          - "{{ molecule_apps_dir }}/molquiet/private/token.age"
        stdin: "{{ molecule_private_quiet.rotated }}"
        stdin_add_newline: false
      changed_when: true
      delegate_to: localhost
      become: false

    - name: Re-deploy the app whose units the call still does not name
      ansible.builtin.include_role:
        name: binarycodes.homelab.systemd_app
      vars:
        systemd_app_kind: source
        systemd_app_name: molquiet

    # This restart is systemd's, not the role's: the deploy returns once the decrypt instance
    # has restarted, and the app's own restart is a job PartOf= put in the same transaction.
    # So the job exists by now and waiting for the queue to drain is a wait, not a poll for
    # something that may never be enqueued.
    - name: Wait for the jobs the re-deploy propagated to drain
      ansible.builtin.command:
        argv: [systemctl, list-jobs, --no-legend]
      changed_when: false
      register: molecule_quiet_jobs
      until: molecule_quiet_jobs.stdout_lines | select('search', 'molquiet') | list | length == 0
      retries: 30
      delay: 2

    - name: Ask the container to read its private file after the rotation
      ansible.builtin.command:
        argv: [podman, exec, molquiet, cat, /etc/molquiet/token]
      changed_when: false
      register: molecule_quiet_rotated

    - name: Ask systemd for the state of the hand-started app and its decrypt
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ item }}"]
      loop:
        - molquiet.service
        - homelab-private-decrypt@molquiet.service
      changed_when: false
      failed_when: false
      register: molecule_quiet_units

    - name: Assert the running app was carried onto the re-made runtime directory
      ansible.builtin.assert:
        that:
          # The hand start pulled the decrypt in, so the first read is the original value.
          - molecule_quiet_first.stdout == (molecule_private_quiet.first | trim)
          # And the deploy reached a container the role never names.
          - molecule_quiet_rotated.stdout == (molecule_private_quiet.rotated | trim)
          - molecule_quiet_units.results | rejectattr('stdout', 'equalto', 'active')
            | list | length == 0
        fail_msg: >-
          Read {{ molecule_quiet_first.stdout | default('') }} before the rotation and
          {{ molecule_quiet_rotated.stdout | default('') }} after it, wanting
          {{ molecule_private_quiet.rotated | trim }}; units
          {{ molecule_quiet_units.results | map(attribute='item')
             | zip(molecule_quiet_units.results | map(attribute='stdout')) | list }}.
        quiet: true

    # --- the same app, converted to the other kind -------------------------------------
    # The role prunes and disables the unit file but cannot stop a unit the app no longer
    # ships; that is the caller's job, once. Stopped only, not disabled: removing the
    # `.wants/` symlink is the role's job, and the assertion after the flip is that it did.
    - name: Stop the unit the converted app will no longer ship
      ansible.builtin.systemd:
        name: molsource-extra.service
        state: stopped

    - name: Deploy the same app as an inline container
      ansible.builtin.include_role:
        name: binarycodes.homelab.systemd_app
      vars:
        systemd_app_kind: inline
        systemd_app_name: molsource
        systemd_app_image: "{{ molecule_image }}"
        systemd_app_domain: molsource.molecule.test
        systemd_app_container_options:
          - Exec=sleep 86400

    - name: Stat what the previous kind installed
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/systemd/system/molsource-extra.service
        - /var/app/molsource/config/app.conf
        - /etc/containers/systemd/molsource.container
      register: molecule_after_flip

    - name: Read the manifest and Quadlet the flip left behind
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /var/app/molsource/.install-manifest
        - /etc/containers/systemd/molsource.container
      register: molecule_flip_files

    - name: Ask systemd for the state of the converted app
      ansible.builtin.command:
        argv: [systemctl, is-active, molsource.service]
      changed_when: false
      register: molecule_flipped_unit

    # -xtype l finds a symlink whose target is gone: the enable wrote one into
    # multi-user.target.wants/ and the prune took what it pointed at.
    - name: Look for dangling unit symlinks after the flip
      ansible.builtin.command:
        argv: [find, /etc/systemd/system, -xtype, l, -name, "mol*"]
      changed_when: false
      register: molecule_flip_dangling

    - name: Assert the conversion pruned the other kind and runs from the rendered Quadlet
      ansible.builtin.assert:
        that:
          # The prune crossing kinds is why a manifest is recorded for both.
          - not molecule_after_flip.results[0].stat.exists
          - not molecule_after_flip.results[1].stat.exists
          - molecule_after_flip.results[2].stat.exists
          - molecule_flip_recorded == ['/etc/containers/systemd/molsource.container']
          # Now the rendered file, not the fixture's copy.
          - "'Molecule fixture source container' not in molecule_flip_rendered"
          - "'ContainerName=molsource' in molecule_flip_rendered"
          - "'AutoUpdate=registry' in molecule_flip_rendered"
          # A changed unit definition means a new container.
          - molecule_flipped_unit.stdout == 'active'
          # Disabled before its file went, so no .wants/ entry still names it.
          - molecule_flip_dangling.stdout_lines | length == 0
        fail_msg: >-
          Recorded after the flip: {{ molecule_flip_recorded }}; dangling:
          {{ molecule_flip_dangling.stdout_lines }}.
        quiet: true
      vars:
        molecule_flip_recorded: "{{ (molecule_flip_files.results[0].content | b64decode).splitlines() }}"
        molecule_flip_rendered: "{{ molecule_flip_files.results[1].content | b64decode }}"

    # --- secrets: rotated, dropped, and re-stored after drift ----------------------------
    # podman cannot update a secret in place, so a changed value is a remove then a create.
    # The unit tests cover that arithmetic against a fake store; this covers a real podman
    # accepting it.
    - name: Re-encrypt the fixture secrets with one value changed and one name gone
      community.sops.sops_encrypt:
        path: "{{ molecule_apps_dir }}/molsecret/secrets.sops.yaml"
        age: ["{{ molecule_sops_recipient }}"]
        content_yaml: "{{ molecule_secrets_rotated }}"
        force: true
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Re-deploy the secrets app over the rotated file
      ansible.builtin.include_role:
        name: binarycodes.homelab.systemd_app
      vars:
        systemd_app_kind: inline
        systemd_app_name: molsecret
        systemd_app_image: "{{ molecule_image }}"
        systemd_app_container_options:
          - Exec=sleep 86400
        systemd_app_auto_update: never

    - name: Read back the store and the record after the rotation
      ansible.builtin.include_tasks: tasks/read-secret-state.yml

    - name: Assert the changed value was re-stored and the dropped name removed
      ansible.builtin.assert:
        that:
          # The value podman holds is the new one, so the rm-then-create ran rather than
          # the create being refused for a name that already existed — and the dropped
          # name is gone from the store, whose key set is what a later deploy and the
          # decommission below work from to know which secrets this app owns.
          - molecule_secret_state == molecule_secrets_rotated | declared_secret_state('molsecret')
        fail_msg: "After the rotation: {{ molecule_secret_state }}."
        quiet: true

    # The store is the only record, so a secret removed by hand — or lost with a store
    # reset — is simply missing on the next deploy and comes back, rather than the app
    # referencing a name podman does not know.
    - name: Remove a stored secret behind the role's back
      ansible.builtin.command:
        argv: [podman, secret, rm, molsecret-token]
      changed_when: true

    - name: Re-deploy the secrets app over the unchanged file
      ansible.builtin.include_role:
        name: binarycodes.homelab.systemd_app
      vars:
        systemd_app_kind: inline
        systemd_app_name: molsecret
        systemd_app_image: "{{ molecule_image }}"
        systemd_app_container_options:
          - Exec=sleep 86400
        systemd_app_auto_update: never

    - name: Read back the store and the record after the drift
      ansible.builtin.include_tasks: tasks/read-secret-state.yml

    - name: Assert the secret the host had lost was stored again
      ansible.builtin.assert:
        that:
          - molecule_secret_state == molecule_secrets_rotated | declared_secret_state('molsecret')
        fail_msg: "After re-deploying over a hand-removed secret: {{ molecule_secret_state }}."
        quiet: true

    # --- a secret another app owns ----------------------------------------------------------
    # Ownership is a label on the secret, and the module refuses to take over a name that
    # carries another app's. The refusal has to leave the other app's secret exactly as it
    # was — a deploy must not be able to steal or overwrite a sibling's value by declaring its
    # name — and has to say whose it is, so the operator knows which app to look at.
    - name: Store a secret owned by another app, under the name the clashing app declares
      ansible.builtin.command:
        argv: [podman, secret, create, --label, io.binarycodes.homelab.app=molother, molclaim-token, "-"]
        stdin: not-ours
        stdin_add_newline: false
      changed_when: true

    # No fixture under apps/ for this app either, for the reason prepare.yml gives for the
    # secrets app: the encrypted file is its only content, and it is written here.
    - name: Create the clashing app's directory in the copied tree
      ansible.builtin.file:
        path: "{{ molecule_apps_dir }}/molclaim"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    - name: Encrypt the clashing app's secrets into the copied tree
      community.sops.sops_encrypt:
        path: "{{ molecule_apps_dir }}/molclaim/secrets.sops.yaml"
        age: ["{{ molecule_sops_recipient }}"]
        content_yaml:
          molclaim-token: mine-now
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Deploy an app declaring a secret another app owns
      block:
        - name: Deploy the clashing app
          ansible.builtin.include_role:
            name: binarycodes.homelab.systemd_app
          vars:
            systemd_app_kind: inline
            systemd_app_name: molclaim
            systemd_app_image: "{{ molecule_image }}"
            systemd_app_container_options:
              - Exec=sleep 86400

        - name: Record that the clashing app was deployed
          ansible.builtin.set_fact:
            molecule_claim_deployed: true
      rescue:
        - name: Record why the clashing app was refused
          ansible.builtin.set_fact:
            molecule_claim_refusal: "{{ ansible_failed_result.msg | default('') }}"

    - name: Read back the other app's secret
      ansible.builtin.command:
        argv: [podman, secret, inspect, --showsecret, molclaim-token]
      changed_when: false
      register: molecule_claim_secret

    - name: Assert the other app's secret was refused, named, and left untouched
      ansible.builtin.assert:
        that:
          - molecule_claim_deployed is not defined
          - "'molclaim-token' in molecule_claim_refusal | default('')"
          - "'molother' in molecule_claim_refusal | default('')"
          # Still the other app's, still the hand-stored value, and still without a digest
          # label: the module wrote nothing on it.
          - "molecule_claim_state == {'molclaim-token': {'owner': 'molother', 'digest': none, 'value': 'not-ours'}}"
        fail_msg: >-
          Deployed: {{ molecule_claim_deployed | default(false) }}; refusal:
          {{ molecule_claim_refusal | default('(none)') }}; the secret now reads
          {{ molecule_claim_state }}.
        quiet: true
      vars:
        molecule_claim_state: "{{ molecule_claim_secret.stdout | secret_state }}"

    # --- a domain another app already routes --------------------------------------------
    # The role sees one app at a time, so this is the one route problem it has to ask the
    # host about, and the answer has to arrive before anything is installed: a second site
    # block on molinline's domain would make Caddy refuse the whole imported config on the
    # next reload. The unit tests cannot reach this — it is a task, not a filter.
    - name: Deploy an app on a domain another app already routes
      block:
        - name: Deploy the clashing app
          ansible.builtin.include_role:
            name: binarycodes.homelab.systemd_app
          vars:
            systemd_app_kind: inline
            systemd_app_name: molclash
            systemd_app_image: "{{ molecule_image }}"
            systemd_app_domain: molinline.molecule.test
            systemd_app_container_options:
              - Exec=sleep 86400

        # Reached only if the role let the clash through; the assertion below reads it.
        - name: Record that the clashing app was deployed
          ansible.builtin.set_fact:
            molecule_clash_deployed: true
      rescue:
        - name: Record why the clashing app was refused
          ansible.builtin.set_fact:
            molecule_clash_refusal: "{{ ansible_failed_result.msg | default('') }}"

    - name: Stat what the clashing app would have installed
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/containers/systemd/molclash.container
        - /var/app/molclash
        - /var/app/molproxy/config/conf.d/molclash.caddy
      register: molecule_clash_paths

    - name: Assert the clash was refused before anything reached the host
      ansible.builtin.assert:
        that:
          - molecule_clash_deployed is not defined
          # The refusal names the snippet that already holds the domain, so the operator
          # knows which app to look at.
          - "'molinline.caddy' in molecule_clash_refusal | default('')"
          - molecule_clash_paths.results | selectattr('stat.exists') | list | length == 0
        fail_msg: >-
          Deployed: {{ molecule_clash_deployed | default(false) }}; refusal:
          {{ molecule_clash_refusal | default('(none)') }}; on the host:
          {{ molecule_clash_paths.results | selectattr('stat.exists')
             | map(attribute='item') | list }}.
        quiet: true

    # --- decommission ------------------------------------------------------------------
    - name: Decommission every fixture app
      ansible.builtin.include_role:
        name: binarycodes.homelab.systemd_app
      vars:
        systemd_app_state: absent
        systemd_app_kind: "{{ molecule_app.kind }}"
        systemd_app_name: "{{ molecule_app.name }}"
      loop: "{{ molecule_fixture_apps }}"
      loop_control:
        loop_var: molecule_app
        label: "{{ molecule_app.name }}"

    - name: Stat everything the fixture apps owned
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /var/app/molsource
        - /var/app/molinline
        - /var/app/molsecret
        - /var/app/molorphan
        - /etc/containers/systemd/molsource.container
        - /etc/containers/systemd/molinline.container
        - /etc/containers/systemd/molsecret.container
        - /etc/containers/systemd/molorphan.container
        - /etc/containers/systemd/molclaim.container
        - /var/app/molclaim
        - /etc/containers/systemd/molecule.network
        - /var/app/molproxy/config/conf.d/molsource.caddy
        - /var/app/molproxy/config/conf.d/molinline.caddy
        # The apps still holding private files by teardown: drop-ins and tmpfs trees go too.
        - /etc/systemd/system/molinline.service.d
        - /run/app/molinline
        - /etc/systemd/system/molquiet.service.d
        - /run/app/molquiet
        - /var/app/molquiet
        - /etc/containers/systemd/molquiet.container
      register: molecule_after_absent

    # In no app's manifest, so no app's decommission removes them.
    - name: Stat the shared decrypt unit and helper after every app is gone
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/systemd/system/homelab-private-decrypt@.service
        - /usr/local/libexec/homelab-decrypt-private
      register: molecule_absent_shared

    - name: Ask systemd for the state of the decommissioned units
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ item }}"]
      loop:
        - molsource.service
        - molinline.service
        - molsecret.service
        - molorphan.service
        - homelab-private-decrypt@molinline.service
        # Started by hand, so its teardown works only from what the manifest recorded.
        - molquiet.service
        - homelab-private-decrypt@molquiet.service
      changed_when: false
      failed_when: false
      register: molecule_absent_units

    # systemctl cannot answer this: once the Quadlet file is gone, is-active reports
    # 'inactive' whether the container stopped or is still running unsupervised.
    - name: Ask podman what containers still exist
      ansible.builtin.command:
        argv: [podman, ps, --all, --format, "{{ '{{' }}.Names{{ '}}' }}"]
      changed_when: false
      register: molecule_absent_containers

    # Host-global, so nothing else would have taken them with the app tree.
    - name: Ask podman what secrets it still holds
      ansible.builtin.command:
        argv: [podman, secret, ls, --format, "{{ '{{' }}.Name{{ '}}' }}"]
      changed_when: false
      register: molecule_absent_secrets

    - name: Look for dangling unit symlinks after the decommission
      ansible.builtin.command:
        argv: [find, /etc/systemd/system, -xtype, l, -name, "mol*"]
      changed_when: false
      register: molecule_absent_dangling

    - name: Assert nothing the apps owned is left on the host
      ansible.builtin.assert:
        that:
          - molecule_after_absent.results | selectattr('stat.exists') | list | length == 0
          # One app's teardown must not break every other app's decrypt.
          - molecule_absent_shared.results | rejectattr('stat.exists') | list | length == 0
          - molecule_absent_dangling.stdout_lines | length == 0
          - molecule_absent_units.results | selectattr('stdout', 'equalto', 'active')
            | list | length == 0
          - molecule_absent_secrets.stdout_lines | select('match', '^molsecret-')
            | list | length == 0
          # Ownership is what says the other app's secret was not molclaim's to remove.
          - "'molclaim-token' in molecule_absent_secrets.stdout_lines"
          - molecule_absent_containers.stdout_lines
            | intersect(molecule_fixture_apps | map(attribute='name') | list) | length == 0
        fail_msg: >-
          Left behind:
          {{ molecule_after_absent.results | selectattr('stat.exists')
             | map(attribute='item') | list }}; still active:
          {{ molecule_absent_units.results | selectattr('stdout', 'equalto', 'active')
             | map(attribute='item') | list }}; containers still on the host:
          {{ molecule_absent_containers.stdout_lines
             | intersect(molecule_fixture_apps | map(attribute='name') | list) }};
          dangling: {{ molecule_absent_dangling.stdout_lines }}.
        quiet: true

    # Nothing owns it, so nothing in the role will ever remove it.
    - name: Remove the other app's secret by hand
      ansible.builtin.command:
        argv: [podman, secret, rm, molclaim-token]
      changed_when: true

    # A decommission works from the manifest on the host, which the first pass took with
    # it, so the second has nothing to read and must still succeed — a failure here is a
    # task that assumes the app is still there.
    - name: Decommission every fixture app again
      ansible.builtin.include_role:
        name: binarycodes.homelab.systemd_app
      vars:
        systemd_app_state: absent
        systemd_app_kind: "{{ molecule_app.kind }}"
        systemd_app_name: "{{ molecule_app.name }}"
      loop: "{{ molecule_fixture_apps }}"
      loop_control:
        loop_var: molecule_app
        label: "{{ molecule_app.name }}"
