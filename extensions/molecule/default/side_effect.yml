# The rest of an app's life, which a converge alone never reaches: a file dropped from its
# source tree, a change of kind, and decommissioning. Each stage asserts immediately after
# the role runs, because the state it produces is the input to the next one.
- name: Side effect
  hosts: all
  become: true
  gather_facts: false

  vars:
    molecule_fixture_apps:
      # The kind each app is in by the time this play tears it down — molsource has been
      # flipped to inline by then, and absent prunes from the manifest either way.
      - {name: molinline, kind: inline}
      - {name: molsource, kind: inline}
      - {name: molnet, kind: source}
      - {name: molsecret, kind: inline}
      # Deployed with systemd_app_enable_units, decommissioned without it — the case a
      # teardown that works only from the caller's unit names cannot stop.
      - {name: molorphan, kind: source}

  tasks:
    # --- a file dropped from the app's source tree -------------------------------------
    - name: Drop a config file from the fixture app tree
      ansible.builtin.file:
        path: "{{ molecule_apps_dir }}/molsource/config/nested/deep.conf"
        state: absent
      delegate_to: localhost
      become: false

    - name: Re-deploy the source app without that file
      ansible.builtin.include_role:
        name: binarycodes.homelab.systemd_app
      vars:
        systemd_app_kind: source
        systemd_app_name: molsource
        systemd_app_enable_units:
          - molsource.service
          - molsource-extra.service
        systemd_app_domain: molsource.molecule.test

    - name: Stat the pruned and the kept config file
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /var/app/molsource/config/nested/deep.conf
        - /var/app/molsource/config/app.conf
      register: molecule_after_prune

    - name: Read the manifest recorded by the re-deploy
      ansible.builtin.slurp:
        src: /var/app/molsource/.install-manifest
      register: molecule_pruned_manifest

    - name: Ask systemd for the state of the source app after the prune
      ansible.builtin.command:
        argv: [systemctl, is-active, molsource.service]
      changed_when: false
      register: molecule_pruned_unit

    - name: Assert the dropped file was removed and recorded as gone
      ansible.builtin.assert:
        that:
          - not molecule_after_prune.results[0].stat.exists
          # Only what this deploy stopped installing goes: the rest of the tree stays.
          - molecule_after_prune.results[1].stat.exists
          - "'/var/app/molsource/config/nested/deep.conf' not in molecule_recorded"
          - "'/var/app/molsource/config/app.conf' in molecule_recorded"
          # A config change reaches a running app without the file's own unit being
          # reinstalled, so the app must still be up.
          - molecule_pruned_unit.stdout == 'active'
        quiet: true
      vars:
        molecule_recorded: "{{ (molecule_pruned_manifest.content | b64decode).splitlines() }}"

    # --- the same app, converted to the other kind -------------------------------------
    # The role prunes the unit file but cannot stop a unit the app no longer ships, which
    # is a caller's job once (see the role README). Done here so the flip below is
    # asserted against a host in the state a real conversion leaves.
    - name: Stop the unit the converted app will no longer ship
      ansible.builtin.systemd:
        name: molsource-extra.service
        state: stopped
        enabled: false

    - name: Deploy the same app as an inline container
      ansible.builtin.include_role:
        name: binarycodes.homelab.systemd_app
      vars:
        systemd_app_kind: inline
        systemd_app_name: molsource
        systemd_app_image: "{{ molecule_image }}"
        systemd_app_domain: molsource.molecule.test
        systemd_app_container_options:
          - Exec=sleep 86400

    - name: Stat what the previous kind installed
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/systemd/system/molsource-extra.service
        - /var/app/molsource/config/app.conf
        - /etc/containers/systemd/molsource.container
      register: molecule_after_flip

    - name: Read the manifest and Quadlet the flip left behind
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /var/app/molsource/.install-manifest
        - /etc/containers/systemd/molsource.container
      register: molecule_flip_files

    - name: Ask systemd for the state of the converted app
      ansible.builtin.command:
        argv: [systemctl, is-active, molsource.service]
      changed_when: false
      register: molecule_flipped_unit

    - name: Assert the conversion pruned the other kind and runs from the rendered Quadlet
      ansible.builtin.assert:
        that:
          # What the 'source' deploy installed and the 'inline' one does not: the prune
          # crossing kinds is the whole reason a manifest is recorded for both.
          - not molecule_after_flip.results[0].stat.exists
          - not molecule_after_flip.results[1].stat.exists
          - molecule_after_flip.results[2].stat.exists
          - molecule_flip_recorded == ['/etc/containers/systemd/molsource.container']
          # The file at that path is now the rendered one, not the fixture's copy.
          - "'Molecule fixture source container' not in molecule_flip_rendered"
          - "'ContainerName=molsource' in molecule_flip_rendered"
          - "'AutoUpdate=registry' in molecule_flip_rendered"
          # A changed unit definition means a new container, so the app is restarted
          # rather than left running on the definition it started with.
          - molecule_flipped_unit.stdout == 'active'
        fail_msg: "Recorded after the flip: {{ molecule_flip_recorded }}."
        quiet: true
      vars:
        molecule_flip_recorded: "{{ (molecule_flip_files.results[0].content | b64decode).splitlines() }}"
        molecule_flip_rendered: "{{ molecule_flip_files.results[1].content | b64decode }}"

    # --- secrets: rotated, dropped, and re-stored after drift ----------------------------
    # Storing is create-only and podman cannot update a secret in place, so a changed value
    # is a remove followed by a create — worked out from three inputs (what the app
    # declares, what it last stored, what the host still holds) by reconcile_secrets. The
    # unit tests cover that arithmetic; what is covered here is the task chain around it.
    - name: Re-encrypt the fixture secrets with one value changed and one name gone
      community.sops.sops_encrypt:
        path: "{{ molecule_apps_dir }}/molsecret/secrets.sops.yaml"
        age: ["{{ molecule_sops_recipient }}"]
        content_yaml: "{{ molecule_secrets_rotated }}"
        force: true
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Re-deploy the secrets app over the rotated file
      ansible.builtin.include_role:
        name: binarycodes.homelab.systemd_app
      vars:
        systemd_app_kind: inline
        systemd_app_name: molsecret
        systemd_app_image: "{{ molecule_image }}"
        systemd_app_container_options:
          - Exec=sleep 86400

    - name: Read back the store and the record after the rotation
      ansible.builtin.include_tasks: tasks/read-secret-state.yml

    - name: Assert the changed value was re-stored and the dropped name removed
      ansible.builtin.assert:
        that:
          - molecule_stored_names == molecule_secrets_rotated | list | sort
          # The value podman holds is the new one, so the rm-then-create ran rather than
          # the create being refused for a name that already existed.
          - molecule_stored_values == molecule_secrets_rotated
          # Dropped from the record too: its key set is what a later deploy — and the
          # decommission below — works from to know which secrets this app owns.
          - molecule_recorded_digests | list | sort == molecule_secrets_rotated | list | sort
        fail_msg: >-
          Stored {{ molecule_stored_names }}, recorded
          {{ molecule_recorded_digests | list | sort }}.
        quiet: true

    # The record says what this app last stored, not what podman still holds. A secret
    # removed by hand — or lost with a store reset — leaves the record matching, so nothing
    # would re-store it, and the app then references a name podman does not know.
    - name: Remove a stored secret behind the role's back
      ansible.builtin.command:
        argv: [podman, secret, rm, molsecret-token]
      changed_when: true

    - name: Re-deploy the secrets app over the unchanged file
      ansible.builtin.include_role:
        name: binarycodes.homelab.systemd_app
      vars:
        systemd_app_kind: inline
        systemd_app_name: molsecret
        systemd_app_image: "{{ molecule_image }}"
        systemd_app_container_options:
          - Exec=sleep 86400

    - name: Read back the store and the record after the drift
      ansible.builtin.include_tasks: tasks/read-secret-state.yml

    - name: Assert the secret the host had lost was stored again
      ansible.builtin.assert:
        that:
          - molecule_stored_values == molecule_secrets_rotated
        fail_msg: "After re-deploying over a hand-removed secret: {{ molecule_stored_names }}."
        quiet: true

    # --- decommission ------------------------------------------------------------------
    - name: Decommission every fixture app
      ansible.builtin.include_role:
        name: binarycodes.homelab.systemd_app
      vars:
        systemd_app_state: absent
        systemd_app_kind: "{{ molecule_app.kind }}"
        systemd_app_name: "{{ molecule_app.name }}"
      loop: "{{ molecule_fixture_apps }}"
      loop_control:
        loop_var: molecule_app
        label: "{{ molecule_app.name }}"

    - name: Stat everything the fixture apps owned
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /var/app/molsource
        - /var/app/molinline
        - /var/app/molsecret
        - /var/app/molorphan
        - /etc/containers/systemd/molsource.container
        - /etc/containers/systemd/molinline.container
        - /etc/containers/systemd/molsecret.container
        - /etc/containers/systemd/molorphan.container
        - /etc/containers/systemd/molecule.network
        - /var/app/molproxy/config/conf.d/molsource.caddy
        - /var/app/molproxy/config/conf.d/molinline.caddy
      register: molecule_after_absent

    - name: Ask systemd for the state of the decommissioned units
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ item }}"]
      loop:
        - molsource.service
        - molinline.service
        - molsecret.service
        - molorphan.service
      changed_when: false
      failed_when: false
      register: molecule_absent_units

    # systemctl alone cannot answer this. Once a Quadlet file is deleted and systemd
    # reloaded, its generated service is gone from systemd's view and is-active reports
    # 'inactive' — whether the container stopped or is still running unsupervised. Podman
    # is the only witness that a decommission actually decommissioned.
    - name: Ask podman what containers still exist
      ansible.builtin.command:
        argv: [podman, ps, --all, --format, "{{ '{{' }}.Names{{ '}}' }}"]
      changed_when: false
      register: molecule_absent_containers

    # Podman secrets are host-global, so they are not part of the app tree removed above:
    # nothing else would have taken them with it.
    - name: Ask podman what secrets it still holds
      ansible.builtin.command:
        argv: [podman, secret, ls, --format, "{{ '{{' }}.Name{{ '}}' }}"]
      changed_when: false
      register: molecule_absent_secrets

    - name: Assert nothing the apps owned is left on the host
      ansible.builtin.assert:
        that:
          - molecule_after_absent.results | selectattr('stat.exists') | list | length == 0
          - molecule_absent_units.results | selectattr('stdout', 'equalto', 'active')
            | list | length == 0
          - molecule_absent_secrets.stdout_lines | select('match', '^molsecret-')
            | list | length == 0
          - molecule_absent_containers.stdout_lines
            | intersect(molecule_fixture_apps | map(attribute='name') | list) | length == 0
        fail_msg: >-
          Left behind:
          {{ molecule_after_absent.results | selectattr('stat.exists')
             | map(attribute='item') | list }}; still active:
          {{ molecule_absent_units.results | selectattr('stdout', 'equalto', 'active')
             | map(attribute='item') | list }}; containers still on the host:
          {{ molecule_absent_containers.stdout_lines
             | intersect(molecule_fixture_apps | map(attribute='name') | list) }}.
        quiet: true

    # A decommission works from the manifest on the host, which the first pass took with
    # it, so the second has nothing to read and must still succeed — a failure here is a
    # task that assumes the app is still there.
    - name: Decommission every fixture app again
      ansible.builtin.include_role:
        name: binarycodes.homelab.systemd_app
      vars:
        systemd_app_state: absent
        systemd_app_kind: "{{ molecule_app.kind }}"
        systemd_app_name: "{{ molecule_app.name }}"
      loop: "{{ molecule_fixture_apps }}"
      loop_control:
        loop_var: molecule_app
        label: "{{ molecule_app.name }}"
