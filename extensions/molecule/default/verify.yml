# What a converge must have left on the host. Asserted from the host's own state rather
# than from the role's task results, so a task that reported 'ok' without writing
# anything still fails here.
- name: Verify
  hosts: all
  become: true
  gather_facts: false

  vars:
    molecule_expected_paths:
      - /etc/containers/systemd/molecule.network
      - /etc/containers/systemd/molsource.container
      - /etc/containers/systemd/molinline.container
      - /etc/systemd/system/molsource-extra.service
      - /var/app/molsource/config/app.conf
      - /var/app/molsource/config/nested/deep.conf
      - /var/app/molsource/.install-manifest
      - /var/app/molinline/.install-manifest
      - /var/app/molproxy/config/conf.d/molsource.caddy
      - /var/app/molproxy/config/conf.d/molinline.caddy
      - /etc/containers/systemd/molsecret.container
      - /var/app/molsecret/.secret-digests
    # Every path the 'source' app installed, and nothing else: this set is what a later
    # deploy reconciles against, so an entry missing here is a file that would survive
    # forever and an extra one is a file that would be deleted from under another app.
    molecule_expected_source_manifest:
      - /etc/containers/systemd/molsource.container
      - /etc/systemd/system/molsource-extra.service
      - /var/app/molsource/config/app.conf
      - /var/app/molsource/config/nested/deep.conf
    molecule_expected_units:
      - molsource.service
      - molsource-extra.service
      - molinline.service
      - molsecret.service

  tasks:
    - name: Stat every path the converge should have installed
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ molecule_expected_paths }}"
      register: molecule_installed

    - name: Assert every expected path is on the host
      ansible.builtin.assert:
        that:
          - molecule_installed.results | rejectattr('stat.exists') | list | length == 0
        fail_msg: >-
          Not installed:
          {{ molecule_installed.results | rejectattr('stat.exists')
             | map(attribute='item') | list }}.
        quiet: true

    - name: Read the recorded install manifests
      ansible.builtin.slurp:
        src: "/var/app/{{ item }}/.install-manifest"
      loop:
        - molsource
        - molinline
      register: molecule_manifests

    - name: Assert each manifest records exactly what its app installed
      ansible.builtin.assert:
        that:
          - molecule_source_recorded | sort == molecule_expected_source_manifest | sort
          # An 'inline' app installs its one rendered Quadlet and nothing else.
          - molecule_inline_recorded == ['/etc/containers/systemd/molinline.container']
        fail_msg: >-
          Recorded source paths {{ molecule_source_recorded | sort }}, inline paths
          {{ molecule_inline_recorded }}.
        quiet: true
      vars:
        molecule_source_recorded: "{{ (molecule_manifests.results[0].content | b64decode).splitlines() }}"
        molecule_inline_recorded: "{{ (molecule_manifests.results[1].content | b64decode).splitlines() }}"

    - name: Read the rendered Quadlet of the inline app
      ansible.builtin.slurp:
        src: /etc/containers/systemd/molinline.container
      register: molecule_inline_quadlet

    - name: Assert the inline app rendered from its call-site parameters
      ansible.builtin.assert:
        that:
          - "'Description=Molecule fixture inline container' in molecule_inline_rendered"
          - "'Image=' ~ molecule_image in molecule_inline_rendered"
          - "'ContainerName=molinline' in molecule_inline_rendered"
          - "'Network=none' in molecule_inline_rendered"
          - "'Exec=sleep 86400' in molecule_inline_rendered"
          # Quoted as one assignment: unquoted, systemd would read 'world' as a second
          # variable. This is systemd_env_lines' output, end to end.
          - "'Environment=\"MOLECULE_GREETING=hello world\"' in molecule_inline_rendered"
          # No healthcheck was asked for, so none of the health block may appear —
          # Notify=healthy without a probe would hang the start until it timed out.
          - "'Notify=healthy' not in molecule_inline_rendered"
        quiet: true
      vars:
        molecule_inline_rendered: "{{ molecule_inline_quadlet.content | b64decode }}"

    - name: Read the generated route snippets
      ansible.builtin.slurp:
        src: "/var/app/molproxy/config/conf.d/{{ item }}.caddy"
      loop:
        - molsource
        - molinline
      register: molecule_routes

    - name: Assert each route names its own domain and upstream
      ansible.builtin.assert:
        that:
          - "'molsource.molecule.test {' in molecule_source_route"
          # The upstream defaults to the app name, on the role's default port.
          - "'reverse_proxy molsource:8080' in molecule_source_route"
          - "'molinline.molecule.test {' in molecule_inline_route"
          - "'reverse_proxy molinline:8080' in molecule_inline_route"
        quiet: true
      vars:
        molecule_source_route: "{{ molecule_routes.results[0].content | b64decode }}"
        molecule_inline_route: "{{ molecule_routes.results[1].content | b64decode }}"

    - name: Stat the pre-created data directory of the inline app
      ansible.builtin.stat:
        path: /var/app/molinline/data
      register: molecule_data_dir

    # Podman would create a missing bind-mount source as root:root, which is exactly what
    # this task exists to prevent, so the ownership is the assertion.
    - name: Assert the data directory was created for the container's own user
      ansible.builtin.assert:
        that:
          - molecule_data_dir.stat.isdir
          - molecule_data_dir.stat.uid == 10001
          - molecule_data_dir.stat.gid == 10001
          - molecule_data_dir.stat.mode == '0700'
        quiet: true

    # --- secrets ------------------------------------------------------------------------
    - name: Ask podman what secrets it holds
      ansible.builtin.command:
        argv: [podman, secret, ls, --format, "{{ '{{' }}.Name{{ '}}' }}"]
      changed_when: false
      register: molecule_secret_names

    # --showsecret rather than the digest record alone: the record says what the last
    # deploy meant to store, and the point of this assertion is that the store agrees.
    - name: Read back every stored secret value
      ansible.builtin.command:
        argv:
          - podman
          - secret
          - inspect
          - --showsecret
          - --format
          - "{{ '{{' }}.SecretData{{ '}}' }}"
          - "{{ item }}"
      loop: "{{ molecule_secrets | dict2items | map(attribute='key') | list }}"
      changed_when: false
      register: molecule_secret_data

    - name: Read the recorded secret digests
      ansible.builtin.slurp:
        src: /var/app/molsecret/.secret-digests
      register: molecule_digest_file

    - name: Stat the recorded secret digests
      ansible.builtin.stat:
        path: /var/app/molsecret/.secret-digests
      register: molecule_digest_stat

    - name: Assert every declared secret was decrypted and stored under its own name
      ansible.builtin.assert:
        that:
          - molecule_secret_names.stdout_lines | sort == molecule_secrets | list | sort
          # The values sops decrypted, as podman now holds them: this is the whole path
          # end to end, from the encrypted file to the store.
          - molecule_stored_values == molecule_secrets
          # A digest of a secret is not a secret, but it is close enough to warrant the
          # same permissions as the store itself.
          - molecule_digest_stat.stat.mode == '0600'
          - molecule_recorded_digests == molecule_expected_digests
        fail_msg: >-
          Stored {{ molecule_secret_names.stdout_lines | sort }}, recorded
          {{ molecule_recorded_digests.keys() | list | sort }}.
        quiet: true
      vars:
        molecule_stored_values: >-
          {{ dict(molecule_secret_data.results | map(attribute='item')
             | zip(molecule_secret_data.results | map(attribute='stdout'))) }}
        molecule_recorded_digests: "{{ molecule_digest_file.content | b64decode | from_json }}"
        molecule_expected_digests: >-
          {{ dict(molecule_secrets | list
             | zip(molecule_secrets.values() | list | map('hash', 'sha256') | list)) }}

    - name: Read the rendered Quadlet of the secrets app
      ansible.builtin.slurp:
        src: /etc/containers/systemd/molsecret.container
      register: molecule_secret_quadlet

    - name: Ask the running container what it was given
      ansible.builtin.command:
        argv: [podman, exec, molsecret, printenv, MOLSECRET_TOKEN]
      changed_when: false
      register: molecule_container_env

    - name: Assert the container references its secrets and receives them as variables
      ansible.builtin.assert:
        that:
          # The name upper-cased with dashes as underscores, which is the contract the
          # role's own key check enforces for an 'inline' app.
          - "'Secret=molsecret-token,type=env,target=MOLSECRET_TOKEN' in molecule_secret_rendered"
          - "'Secret=molsecret-extra,type=env,target=MOLSECRET_EXTRA' in molecule_secret_rendered"
          # No value is written into the unit file: the Quadlet names the secret and
          # podman injects it, which is the reason to use a secret rather than an
          # Environment= line at all.
          - molecule_secrets['molsecret-token'] not in molecule_secret_rendered
          - molecule_container_env.stdout == molecule_secrets['molsecret-token']
        quiet: true
      vars:
        molecule_secret_rendered: "{{ molecule_secret_quadlet.content | b64decode }}"

    - name: Ask systemd for the state of the managed units
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ item }}"]
      loop: "{{ molecule_expected_units }}"
      changed_when: false
      register: molecule_unit_state

    - name: Assert every managed unit is running
      ansible.builtin.assert:
        that:
          - molecule_unit_state.results | rejectattr('stdout', 'equalto', 'active')
            | list | length == 0
        fail_msg: >-
          Not active:
          {{ molecule_unit_state.results | rejectattr('stdout', 'equalto', 'active')
             | map(attribute='item') | list }}.
        quiet: true

    # Only the plain unit: a Quadlet-generated service is 'transient or generated' and
    # cannot be enabled at all, which is why the role tolerates that one failure.
    - name: Ask systemd whether the plain unit starts at boot
      ansible.builtin.command:
        argv: [systemctl, is-enabled, molsource-extra.service]
      changed_when: false
      register: molecule_unit_enabled

    - name: Assert the plain unit was enabled
      ansible.builtin.assert:
        that:
          - molecule_unit_enabled.stdout == 'enabled'
        quiet: true
