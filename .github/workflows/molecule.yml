name: Molecule

# The systemd_app role's behaviour on a host: what the filters' unit tests cannot cover and
# a syntax check never runs. A converge takes minutes, so it is its own workflow rather
# than part of CI.
on:
  pull_request:
    paths:
      - 'roles/systemd_app/**'
      - 'plugins/filter/**'
      - 'extensions/molecule/**'
      - '.github/workflows/molecule.yml'
  push:
    branches: [main]
    paths:
      - 'roles/systemd_app/**'
      - 'plugins/filter/**'
      - 'extensions/molecule/**'
      - '.github/workflows/molecule.yml'
  workflow_dispatch:

# Everything happens inside the runner, so a superseded PR push is worth cancelling. Not
# for a push to main, where the run is the record of whether that commit converges.
concurrency:
  group: molecule-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  molecule:
    name: Converge the systemd_app role
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # converge.yml calls the role by FQCN, as a consuming play does, so the role has to be
    # reachable as a collection and not merely as the directory it is checked out into.
    # Laying the checkout out this way makes the working tree itself the collection, which
    # keeps the run testing the commit rather than a copy installed beside it.
    defaults:
      run:
        working-directory: ansible_collections/binarycodes/homelab

    steps:
      - name: Checkout collection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ansible_collections/binarycodes/homelab

      # Same seam as ci.yml. Two calls, because --include-apps is what puts `molecule` on
      # PATH and pipx fails outright on an injected package with no entry point at all —
      # which the driver, a plugin package, does not have.
      - name: Install molecule and its podman driver
        run: |
          pipx inject ansible-core molecule --include-apps
          pipx inject ansible-core 'molecule-plugins[podman]'

      # The role decrypts an app's secrets through community.sops, which shells out to the
      # sops binary; the scenario ships an age identity and a fixture app that needs one.
      # Not from a package repository, which carries sops on no runner image: a pinned
      # release binary, with its checksum, so a replaced asset fails here rather than
      # running.
      - name: Install sops
        run: |
          curl -fsSL -o /tmp/sops \
            https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          echo 'e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  /tmp/sops' \
            | sha256sum --check --strict
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          sops --version

      - name: Record the podman version
        run: sudo podman version

      # sudo, so the container molecule creates belongs to a rootful podman: the scenario
      # runs a second, rootful podman inside it, and rootful-in-rootless would need
      # concessions (/dev/fuse, subuid ranges) that rootful-in-rootful does not.
      #
      # PATH goes through `env` rather than sudo's own flag because sudoers' secure_path
      # would replace it, and molecule lives in the runner user's pipx venv.
      #
      # Both collection roots are named because they hold different halves of what the
      # converge needs: the workspace holds this collection, $HOME the community.sops
      # installed above, and root would otherwise search neither.
      - name: Test the default scenario
        run: |
          ansible-galaxy collection install community.sops
          sudo env "PATH=$PATH" \
            "ANSIBLE_COLLECTIONS_PATH=$GITHUB_WORKSPACE:$HOME/.ansible/collections" \
            molecule test
