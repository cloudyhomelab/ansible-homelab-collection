---
minor_changes:
  - The new ``external_packages`` role installs deb or rpm package files that no repository
    carries, such as a project's release downloads. Each entry of ``external_packages_list``
    names the package, its version, a URL and a checksum; the role downloads and installs it
    only when it is not installed at that version, verifies the download against the checksum
    and deletes it afterwards. The new ``package_validation_errors`` filter checks the entries
    before anything is downloaded.
