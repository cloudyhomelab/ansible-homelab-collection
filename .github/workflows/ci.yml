name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Callable, so release.yml runs this gate against the tagged commit rather than
  # trusting a tick from whenever main last ran. The triggers above never fire for a tag.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout collection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Injected into the runner image's own ansible-core venv rather than pip-installed
      # beside it, so the lint runs against the very ansible-core a consumer would use
      # instead of the second, collection-less one pip drags in as a dependency.
      # --include-apps is what puts the ansible-lint and pytest entry points on PATH.
      - name: Install ansible-lint and pytest
        run: pipx inject ansible-core ansible-lint pytest --include-apps

      # The role calls community.sops.load_vars, so the lint's own syntax check needs the
      # collection present to resolve it.
      - name: Install the collection's dependencies
        run: ansible-galaxy collection install community.sops

      - name: Unit-test the filter plugins
        run: pytest tests/unit -q

      - name: Lint
        run: ansible-lint

      - name: Build the collection
        run: ansible-galaxy collection build --output-path /tmp/collection-build
