ancestor: null
releases:
  1.0.0:
    release_date: '2026-09-01'
    changes:
      release_summary: First release. Extracted from the playbook repository it grew
        up in, with the repository-specific parts removed.
      minor_changes:
        - The ``systemd_app`` role deploys or decommissions one app, either from a
          controller directory of Quadlet files, systemd units and config (``source``)
          or as a single-container Quadlet rendered from call-site parameters
          (``inline``); install-manifest reconciliation across both kinds;
          SOPS-encrypted podman secrets with digest-based rotation; an optional Caddy
          route; pre-created bind-mount directories; healthcheck-gated
          ``podman auto-update`` rollback.
        - Filters ``secret_digests``, ``reconcile_secrets``, ``route_problems``,
          ``container_problems``, ``systemd_env_lines`` and ``manifest_units``,
          callable independently of the role.
        - Molecule scenario covering both kinds, idempotence, the manifest prune, a
          change of kind, the secrets path end to end - decrypted, stored, rotated,
          dropped and re-stored after drift - and a repeated decommission that stops
          what an app is running whether or not the call names its units.
