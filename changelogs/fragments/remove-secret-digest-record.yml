---
removed_features:
  - The ``podman_secrets`` module's ``adopt_file`` option is removed, and the ``systemd_app``
    role no longer reads or removes the ``.secret-digests`` file releases before 1.1.0 kept in
    an app's home.
breaking_changes:
  - An app last deployed with a release before 1.1.0 and decommissioned with ``state=absent``
    without a deploy in between leaves its podman secrets in the store, since they carry no
    owner label. Deploy it once first, which labels every secret it declares, or remove them
    with ``podman secret rm``.
