# The floor is the ansible-core the oldest platform this collection claims ships as a
# controller — Debian 13's 2.19 — which is also the oldest release still supported upstream.
# Nothing in the role needs a keyword that new; the number says what is tested, not what
# the syntax requires, and it moves when the platform does.
#
# Tested rather than merely declared: .github/workflows/supported-versions.yml runs the
# unit tests, a syntax check of a play that uses the role, and ansible-test sanity against
# this version as well as the current release. Raise this and the role's
# min_ansible_version together with that matrix, never one without the others.
requires_ansible: ">=2.19.0"
