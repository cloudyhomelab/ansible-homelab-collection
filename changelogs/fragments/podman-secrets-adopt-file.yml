minor_changes:
  - >-
    The ``podman_secrets`` module gained ``adopt_file``: a file on the host whose JSON
    object's keys are added to ``adopt``. The ``systemd_app`` role passes the record releases
    before 1.1.0 wrote, ``/var/app/<app>/.secret-digests``, instead of reading it on the
    controller with ``slurp`` and decoding it in Jinja. A record that is not a JSON object
    now fails the decommission with the file named and what to do about it, where before it
    failed with a template traceback.
