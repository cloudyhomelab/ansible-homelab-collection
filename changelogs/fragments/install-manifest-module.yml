minor_changes:
  - >-
    New module ``install_manifest``: keeps an app's install manifest on the host, pruning
    what the last deploy installed and this one does not, recording what this one did, and
    removing everything recorded on decommission. Every recorded path is checked against the
    app's install roots first, and the units the record implies are returned so a
    decommission need not be told them. Supports check and diff mode. The ``systemd_app``
    role now uses it; the record format is unchanged.
deprecated_features:
  - >-
    The ``manifest_units`` filter is deprecated and will be removed in 2.0.0. The
    ``install_manifest`` module returns the same names as ``units``.
security_fixes:
  - >-
    The ``systemd_app`` role now refuses an install manifest line that names a directory and
    removes nothing. Previously such a line passed the path checks and reached
    ``file: state=absent``, which removes recursively - a ``.wants`` directory inside
    ``/etc/systemd/system``, or a subtree of the app's config, was within reach of a
    tampered record. Pruned paths are now unlinked, never removed recursively.
