galaxy_info:
  role_name: systemd_slices
  namespace: binarycodes
  author: binarycodes
  description: >-
    Install systemd slice units with resource-control settings, for units to be placed in
    with Slice=.
  license: GPL-3.0-or-later
  # Kept in step with meta/runtime.yml at the collection root.
  min_ansible_version: "2.19"

  # The platforms the molecule scenario converges, as for the systemd_app role.
  platforms:
    - name: Fedora
      versions: ["43"]
    - name: Debian
      versions: [trixie]

  galaxy_tags:
    - systemd
    - cgroups

dependencies: []
