# Destructive and not reversible; back the app up first.
#
# The install dirs are shared, so nothing there goes by pattern: what goes is exactly what the
# last deploy recorded, whichever kind wrote it, so teardown needs no controller-side tree.
# {{ systemd_app_home }} is this app's alone and goes wholesale. Podman named volumes and
# networks are NOT removed: they outlive the units that declared them, and Caddy's TLS
# certificates live in one. Remove those by hand once you are sure.

# The removal call below in check mode: what the record lists is what has to be stopped, and
# the units must go while their files still exist. A refused record fails before anything
# stops.
- name: "Read recorded install manifest for app {{ systemd_app_name }}"
  binarycodes.homelab.install_manifest:
    path: "{{ systemd_app_manifest_file }}"
    system_dir: "{{ systemd_app_system_dir }}"
    unit_dir: "{{ systemd_app_unit_dir }}"
    config_dir: "{{ systemd_app_home }}/config"
    private_dir: "{{ systemd_app_private_dir }}"
    state: absent
  check_mode: true
  changed_when: false
  register: systemd_app_manifest

# Stop while the generated units still exist: stopping a Quadlet service also removes its
# container (ExecStopPost). Tolerate a unit never deployed, so a repeat decommission stays
# green.
#
# The manifest is consulted as well as systemd_app_managed_units, and that is the difference
# between a decommission and an orphan: a caller who deployed with systemd_app_enable_units
# and does not repeat it here would have every unit file deleted while the containers keep
# running, with nothing left that names them.
- name: "Stop units for app {{ systemd_app_name }}"
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
  loop: "{{ (systemd_app_managed_units + (systemd_app_manifest.units | default([]))) | unique | sort }}"
  register: systemd_app_stop_result
  failed_when:
    - systemd_app_stop_result is failed
    - "'not loaded' not in (systemd_app_stop_result.msg | default('') | lower)"
    - "'could not find' not in (systemd_app_stop_result.msg | default('') | lower)"

# `systemctl disable` removes the `.wants/` symlinks [Install] names, and can only do so while
# it can read the file. A separate task from the stop: the systemd module disables before it
# stops and fails out on the first refusal, which for a Quadlet service would leave it
# running.
- name: "Disable units for app {{ systemd_app_name }}"
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
  loop: "{{ (systemd_app_managed_units + (systemd_app_manifest.units | default([]))) | unique | sort }}"
  register: systemd_app_disable_result
  failed_when:
    - systemd_app_disable_result is failed
    - "'transient or generated' not in (systemd_app_disable_result.msg | default(''))"
    - "'no installation config' not in (systemd_app_disable_result.msg | default('') | lower)"
    - "'not loaded' not in (systemd_app_disable_result.msg | default('') | lower)"
    - "'could not find' not in (systemd_app_disable_result.msg | default('') | lower)"
    - "'does not exist' not in (systemd_app_disable_result.msg | default('') | lower)"

# Stopping the instance takes its tmpfs tree of plaintext with it. The template unit and the
# helper are NOT removed: shared by every app, written identically by each, in no app's
# manifest. Same call as the podman networks and volumes above.
- name: "Stop the private decrypt of app {{ systemd_app_name }}"
  ansible.builtin.systemd:
    name: "{{ systemd_app_private_unit }}@{{ systemd_app_name }}.service"
    state: stopped
  register: systemd_app_private_stop
  failed_when:
    - systemd_app_private_stop is failed
    - "'not loaded' not in (systemd_app_private_stop.msg | default('') | lower)"
    - "'could not find' not in (systemd_app_private_stop.msg | default('') | lower)"

# An 'inline' app last deployed before the role recorded manifests for that kind has none, and
# its rendered Quadlet would be left behind forever. Removing a path already gone is a no-op.
- name: "Remove rendered Quadlet for container {{ systemd_app_name }}"
  ansible.builtin.file:
    path: "{{ systemd_app_system_dir }}/{{ systemd_app_name }}.container"
    state: absent
  when: systemd_app_kind == 'inline'
  notify: systemd_app reload systemd

# Everything the record names, and the record. By list, never by pattern.
- name: "Remove installed files for app {{ systemd_app_name }}"
  binarycodes.homelab.install_manifest:
    path: "{{ systemd_app_manifest_file }}"
    system_dir: "{{ systemd_app_system_dir }}"
    unit_dir: "{{ systemd_app_unit_dir }}"
    config_dir: "{{ systemd_app_home }}/config"
    private_dir: "{{ systemd_app_private_dir }}"
    state: absent
  notify: systemd_app reload systemd

# Host-global, so not part of the tree removed below. The module removes every secret labelled
# as this app's, needing nothing from the controller, and refuses another app's.
#
# Pre-1.1.0 recorded ownership in a file rather than as labels, so the module has to be told
# which names to adopt. Read before the home holding that record goes. Remove `adopt_file` at
# 2.0.0.
- name: "Remove podman secrets of app {{ systemd_app_name }}"
  binarycodes.homelab.podman_secrets:
    app: "{{ systemd_app_name }}"
    state: absent
    adopt_file: "{{ systemd_app_home }}/.secret-digests"

# The one task that removes a tree, so the composed path is re-checked rather than trusted
# from main.yml. A name with a slash or a leading dot would reach systemd_app_root itself.
- name: "Verify the home directory to remove belongs to app {{ systemd_app_name }}"
  ansible.builtin.assert:
    that:
      - systemd_app_name | binarycodes.homelab.app_validation_errors(kind=systemd_app_kind, state='absent') | length == 0
      - systemd_app_home == systemd_app_root ~ '/' ~ systemd_app_name
      - systemd_app_home != systemd_app_root
    fail_msg: >-
      Refusing to remove {{ systemd_app_home }}: an app's home must be exactly one named
      child of {{ systemd_app_root }}, and '{{ systemd_app_name }}' does not compose one.
    quiet: true

# The manifest went with the files above; what is left is the deployed config and whatever the
# app wrote under its home.
- name: "Remove config and data of app {{ systemd_app_name }}"
  ansible.builtin.file:
    path: "{{ systemd_app_home }}"
    state: absent

# In the reverse proxy's config tree, not this app's, so it goes explicitly. The route stops
# resolving when the deploy playbook reloads Caddy.
- name: "Remove Caddy route for {{ systemd_app_name }}"
  ansible.builtin.file:
    path: "{{ systemd_app_caddy_confd }}/{{ systemd_app_name }}.caddy"
    state: absent

# Forget the now-removed generated units, here rather than at end of play.
- name: Apply unit changes (systemd daemon-reload)
  ansible.builtin.meta: flush_handlers
