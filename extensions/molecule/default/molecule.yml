# The role needs systemd as PID 1 and podman on the target, so: one privileged container
# running /sbin/init with podman inside it (see Dockerfile.j2).
driver:
  name: podman

# One platform chosen by environment; the workflow sets MOLECULE_DISTRO and MOLECULE_IMAGE per
# family, a local run without either gets Fedora. One scenario, so the plays cannot drift apart
# between platforms.
platforms:
  - name: systemd-app-${MOLECULE_DISTRO:-fedora}
    # Bump only to a tag that has shipped. Rawhide is on Python 3.15, which dropped
    # `dataclasses._is_type`; ansible-core patches that unconditionally on module_utils import
    # (2.19-2.21), so every module dies before it runs and reports "Module result
    # deserialization failed" rather than a version problem. Debian's tag is in the workflow.
    image: ${MOLECULE_IMAGE:-quay.io/fedora/fedora:43}
    # Built rather than pulled: the base images ship none of systemd, podman or python3. The
    # driver tags the result molecule_local/<image>, so two families never share a build.
    dockerfile: Dockerfile.${MOLECULE_DISTRO:-fedora}.j2
    pre_build_image: false
    # An init command turns on podman's systemd mode, which mounts /run and sets up cgroups.
    command: /sbin/init
    # Rootful podman inside a container needs mount, cgroup and namespace operations no
    # capability set short of privileged allows. The container is throwaway.
    privileged: true

# converge.yml names the role by FQCN and lets ANSIBLE_COLLECTIONS_PATH resolve it, as a
# consuming play does. Molecule does not install the collection, so the checkout has to be laid
# out as one; see this scenario's README.
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        # Copied out of the scenario by prepare.yml so side_effect.yml can mutate it.
        molecule_fixture_source: "{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}/apps"
        molecule_apps_dir: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/apps"
        # A few megabytes, pulled by prepare.yml before any unit starts.
        molecule_image: quay.io/libpod/alpine:latest

        # Fleet-wide role inputs, set once as a consuming play sets them.
        systemd_app_apps_dir: "{{ molecule_apps_dir }}"
        # No netavark in the critical path: see apps/molsource/quadlet/molsource.container.
        systemd_app_network: none
        # Somewhere to write route snippets that is not a real reverse proxy's config tree.
        systemd_app_caddy_confd: /var/app/molproxy/config/conf.d

        # The recipient of sops/age-key.txt. Only prepare.yml and side_effect.yml use it.
        molecule_sops_recipient: age17svute832444rnpteey2lapzwac3k80efzwcxlm0ypu29c0tvcuq43g9uw
        # Plaintext here rather than an encrypted file under version control, so what the
        # store is asserted to hold is readable next to the assertion.
        molecule_secrets:
          molsecret-token: first-token-value
          molsecret-extra: second-value
        # What side_effect.yml re-encrypts over it: one value changed and one name gone, so
        # a single re-deploy covers both the rm-then-create rotation and the drop.
        molecule_secrets_rotated:
          molsecret-token: rotated-token-value

        # Same argument as the secrets above. `tool` and `out` are named rather than derived,
        # so verify.yml asserts against the intent and not against the rule under test. The
        # tree's plaintext member is committed instead (apps/molsource/private/ca.crt). A
        # sops fixture's content is a YAML document, which is what its suffix decrypts to.
        molecule_private_files:
          - app: molsource
            path: db.env.age
            tool: age
            out: db.env
            content: "DATABASE_URL=postgres://molsource\n"
          - app: molsource
            path: nested/conf.sops.yaml
            tool: sops
            out: nested/conf.yaml
            content: "molsource_nested: nested-private-value\n"
          - app: molinline
            path: tls.key.age
            tool: age
            out: tls.key
            content: "not-really-a-key\n"

        # Deliberately not in the list above: verify.yml reads that one out of /run, and this
        # app's decrypt is asserted never to have run, because the call names no units for it.
        # side_effect.yml starts it by hand and re-encrypts `rotated` over `first`.
        molecule_private_quiet:
          first: "first-token\n"
          rotated: "rotated-token\n"

# sops finds the identity through its own environment variable, as a consumer supplies it.
# Interpolated by molecule before the provisioner runs; prepare.yml asserts the result is a
# real file, so a failed interpolation says so rather than failing later inside sops.
ansible:
  env:
    SOPS_AGE_KEY_FILE: ${MOLECULE_SCENARIO_DIRECTORY}/sops/age-key.txt

# verify before side_effect, unlike the default sequence: verify asserts what a converge
# leaves, then side_effect walks the app through the rest of its life, asserting each step.
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - side_effect
    - destroy

verifier:
  name: ansible
