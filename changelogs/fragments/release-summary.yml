---
release_summary: >-
  Installing a downloaded package file is now a task of its own: the new
  ``binarycodes.homelab.external_package`` module installs one deb or rpm per call, the way
  ``ansible.builtin.package`` installs from a repository, and composes with ``loop``, ``when``
  and ``register``. It keeps what the ``external_packages`` role did: the input checks before
  any download, the pinned checksum, the skip for a package already at its version, check mode
  and the cleanup of the download. Read the breaking changes before upgrading: the
  ``external_packages`` role and the ``package_validation_errors`` filter are removed, and a
  play moves each ``external_packages_list`` entry to an ``external_package`` task with the
  same four keys. Packages the role installed stay installed and are recognised by version.
