minor_changes:
  - >-
    New filter ``source_tree``: what a ``source`` app ships, read from its directory on the
    controller - the files of ``quadlet/`` and ``unit/``, every file of ``config/`` - and the
    host path each installs to. The ``systemd_app`` role now records its install manifest
    from it instead of composing the paths in the play.
bugfixes:
  - >-
    A symlink to a file under a ``source`` app's ``config/`` is now recorded in the install
    manifest. The copy that deploys the tree follows it and installs a regular file, but the
    search that listed the tree did not, so the file was never pruned once the app stopped
    shipping it.
