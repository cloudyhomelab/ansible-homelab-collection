# Everything the role is entitled to assume about a host: systemd up, podman working,
# the Quadlet drop-in directory in place, and the fixture image already local.
- name: Prepare
  hosts: all
  become: true
  gather_facts: false

  tasks:
    # Copied out of the scenario so the side-effect play can drop a file from an app's
    # source tree — the way a real app loses one between deploys — without editing a file
    # that is under version control.
    - name: Copy the fixture app tree where a converge may mutate it
      ansible.builtin.copy:
        src: "{{ molecule_fixture_source }}/"
        dest: "{{ molecule_apps_dir }}/"
        mode: "0644"
        directory_mode: "0755"
      delegate_to: localhost
      become: false

    # A scenario that cannot decrypt would otherwise fail deep inside the role, with sops
    # reporting only that it found no identity. Checked here, where the message can say
    # which file was expected and that molecule.yml is what points at it.
    - name: Assert the scenario's age identity is where sops will look for it
      ansible.builtin.assert:
        that:
          - molecule_age_keyfile | length > 0
          - molecule_age_keyfile is exists
        fail_msg: >-
          SOPS_AGE_KEY_FILE is {{ molecule_age_keyfile | default('unset', true) }}, which is
          not a file. It is set in molecule.yml's ansible.env and has to interpolate to
          {{ molecule_fixture_source | dirname }}/sops/age-key.txt.
        quiet: true
      delegate_to: localhost
      become: false
      vars:
        molecule_age_keyfile: "{{ lookup('ansible.builtin.env', 'SOPS_AGE_KEY_FILE') }}"

    # An 'inline' app that ships secrets has a directory holding just the encrypted file,
    # which is why this one has no counterpart under the scenario's apps/ tree: git cannot
    # carry an empty directory, and the file itself is written below rather than committed.
    - name: Create the fixture secrets app's directory in the copied tree
      ansible.builtin.file:
        path: "{{ molecule_apps_dir }}/molsecret"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    # Encrypted here rather than committed: the values are then readable next to the
    # assertions that check them, and a change to one needs no ciphertext regenerated by
    # hand. The role sees exactly what a real app ships — a sops file it must decrypt.
    - name: Encrypt the fixture secrets into the copied tree
      community.sops.sops_encrypt:
        path: "{{ molecule_apps_dir }}/molsecret/secrets.sops.yaml"
        age: ["{{ molecule_sops_recipient }}"]
        content_yaml: "{{ molecule_secrets }}"
        mode: "0600"
      delegate_to: localhost
      become: false

    # Units the role starts are ordered after basic.target, so a converge racing the
    # boot would see them queued rather than started. 'degraded' is expected and fine:
    # the image masks the units a container cannot run.
    - name: Wait for systemd to finish booting
      ansible.builtin.command:
        argv: [systemctl, is-system-running, --wait]
      changed_when: false
      failed_when: false

    # Owned by the podman package on a real host, not created by the role — so it is a
    # precondition of the scenario rather than something under test.
    - name: Ensure the Quadlet drop-in directory exists
      ansible.builtin.file:
        path: /etc/containers/systemd
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Pulled here so a registry problem fails the run before the role is under test, and
    # so no unit start below waits on a download.
    - name: Pull the fixture container image
      ansible.builtin.command:
        argv: [podman, pull, "{{ molecule_image }}"]
      changed_when: true
