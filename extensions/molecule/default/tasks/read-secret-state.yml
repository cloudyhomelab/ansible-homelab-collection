# The store and the record, read as one. Every secrets assertion in side_effect.yml
# compares the two against each other, and each stage leaves them in a different state, so
# they are read again per stage rather than once at the top of the play.
- name: List the secrets podman holds
  ansible.builtin.command:
    argv: [podman, secret, ls, --format, "{{ '{{' }}.Name{{ '}}' }}"]
  changed_when: false
  register: molecule_secret_ls

# --showsecret, because the point of these stages is that the value in the store changed —
# which the recorded digest alone cannot show, being written from the declared value
# whether or not podman took it.
- name: Read back the value of every secret this app owns
  ansible.builtin.command:
    argv:
      - podman
      - secret
      - inspect
      - --showsecret
      - --format
      - "{{ '{{' }}.SecretData{{ '}}' }}"
      - "{{ item }}"
  loop: "{{ molecule_secret_ls.stdout_lines | select('match', '^molsecret-') | list }}"
  changed_when: false
  register: molecule_secret_inspect

- name: Read the digests the last deploy recorded
  ansible.builtin.slurp:
    src: /var/app/molsecret/.secret-digests
  register: molecule_secret_digest_slurp

- name: Collect the store and the record for the assertions that follow
  ansible.builtin.set_fact:
    molecule_stored_names: >-
      {{ molecule_secret_ls.stdout_lines | select('match', '^molsecret-') | list | sort }}
    molecule_stored_values: >-
      {{ dict(molecule_secret_inspect.results | map(attribute='item')
         | zip(molecule_secret_inspect.results | map(attribute='stdout'))) }}
    molecule_recorded_digests: >-
      {{ molecule_secret_digest_slurp.content | b64decode | from_json }}
