# Deploys (state=present) or decommissions (state=absent) one app. Two kinds:
#   source -> install Quadlet files, systemd units, and a config tree from a
#             controller directory ({{ systemd_app_apps_dir }}/<name>/).
#   inline -> render a single-container Quadlet from call-site params (image, env, ...).
# Both kinds optionally register a Caddy route. See README + defaults/main.yml.

# The name composes every install path and, on absent, a recursive delete of the app's
# home, so it has to be one plain path segment; the two conditional requirements cannot
# be expressed in meta/argument_specs.yml, which can only mark an option required outright.
# A 'source' app's directory is looked for here too, on the controller, before anything is
# touched: the filter behind systemd_app_source_tree refuses a missing one as well, but is
# first read after the secrets are reconciled.
# What is refused, and why, is in the filter's own docs
# (`ansible-doc -t filter binarycodes.homelab.app_validation_errors`). Nothing here interpolates
# systemd_app_name, so an undefined or unusable name fails this task rather than its title.
# The secrets file is passed by its keys alone, and only on present: the values are podman's,
# never a filter's, and a decommission must not need the key that decrypts them.
- name: Validate role input
  ansible.builtin.assert:
    that:
      - systemd_app_app_validation_errors | length == 0
    fail_msg: >-
      The 'systemd_app' role cannot act on this app as given:
      {{ systemd_app_app_validation_errors | join('; ') }}.
    quiet: true
  vars:
    systemd_app_app_validation_errors: >-
      {{ systemd_app_name | default('') | binarycodes.homelab.app_validation_errors(
           kind=systemd_app_kind | default(''),
           state=systemd_app_state,
           image=systemd_app_image | default(''),
           apps_dir=systemd_app_apps_dir | default(''),
           data_dirs=systemd_app_data_dirs,
           secret_names=(systemd_app_secret_values | list) if systemd_app_state == 'present' else []) }}

# The values checked below are interpolated into files this role generates rather than
# passed to a module, so a stray character does not fail the task that writes them. Caddy
# refuses a whole imported config, which takes every other app's route down with one bad
# domain, and systemd mis-parses an Environment= line into a different variable without
# complaining. Checked here, alongside the rest of the input, so a typo at a call site is a
# failed run rather than a half-deployed app or a proxy that will not load.
#
# Both filters return one string per problem, so a run reports everything wrong at once
# rather than the first thing. What each accepts, and why, is in the filter's own docs
# (`ansible-doc -t filter binarycodes.homelab.route_validation_errors`).
- name: "Verify the route inputs of app {{ systemd_app_name }}"
  ansible.builtin.assert:
    that:
      - systemd_app_route_validation_errors | length == 0
    fail_msg: >-
      App {{ systemd_app_name }} cannot be routed as given:
      {{ systemd_app_route_validation_errors | join('; ') }}.
    quiet: true
  vars:
    systemd_app_route_validation_errors: >-
      {{ systemd_app_domain | binarycodes.homelab.route_validation_errors(systemd_app_upstream, systemd_app_port) }}
  when:
    - systemd_app_state == 'present'
    - systemd_app_domain is defined
    - systemd_app_domain | string | length > 0

# The one route problem the filter cannot see: two apps naming one domain write two site
# blocks with one address, which Caddy refuses as an ambiguous site definition — and since
# the Caddyfile imports every snippet, that takes every other app's route down with it. The
# role sees one app at a time, so the question is put to the host instead: is this domain
# already the address of a site block in any other app's snippet. Asked here, with the rest
# of the input, so the answer is a failed run before anything is installed rather than an
# app deployed without its route.
#
# `contains` is matched per line from the line's start, which is where this role writes the
# address, so a hand-written snippet that lists several addresses on one line is outside
# what this catches; `caddy validate` in the consuming play is the backstop for that. A
# conf.d directory that does not exist yet has no snippets in it, and find says so rather
# than failing.
- name: "Look for another app's route on the domain of {{ systemd_app_name }}"
  ansible.builtin.find:
    paths: "{{ systemd_app_caddy_confd }}"
    patterns: '*.caddy'
    excludes: "{{ systemd_app_name }}.caddy"
    contains: '^\s*{{ systemd_app_domain | regex_escape }}\s*\{'
    file_type: file
  register: systemd_app_route_clash
  when:
    - systemd_app_state == 'present'
    - systemd_app_domain is defined
    - systemd_app_domain | string | length > 0

- name: "Refuse a domain another app already routes: {{ systemd_app_name }}"
  ansible.builtin.assert:
    that:
      - systemd_app_route_clash.files | default([]) | length == 0
    fail_msg: >-
      App {{ systemd_app_name }} cannot take {{ systemd_app_domain }}: it is already the
      address of a site block in
      {{ systemd_app_route_clash.files | default([]) | map(attribute='path') | join(', ') }}.
      Two site blocks with one address make Caddy refuse the whole imported config, taking
      every app's route down. Change one domain, or decommission the other app first.
    quiet: true
  when:
    - systemd_app_state == 'present'
    - systemd_app_domain is defined
    - systemd_app_domain | string | length > 0

- name: "Verify the rendered container inputs of app {{ systemd_app_name }}"
  ansible.builtin.assert:
    that:
      - systemd_app_container_validation_errors | length == 0
    fail_msg: >-
      App {{ systemd_app_name }} has values that would not survive into its Quadlet:
      {{ systemd_app_container_validation_errors | join('; ') }}.
    quiet: true
  vars:
    # Named rather than positional: every value inline.container.j2 interpolates is here,
    # and which one is missing has to be visible at a glance when the template gains a line.
    systemd_app_container_validation_errors: >-
      {{ systemd_app_env | binarycodes.homelab.container_validation_errors(
           description=systemd_app_description | default(''),
           volumes=systemd_app_volumes,
           publish_ports=systemd_app_publish_ports,
           container_options=systemd_app_container_options,
           service_options=systemd_app_service_options,
           image=systemd_app_image | default(''),
           network=systemd_app_network,
           health_cmd=systemd_app_health_cmd,
           health_interval=systemd_app_health_interval,
           health_retries=systemd_app_health_retries,
           health_start_period=systemd_app_health_start_period,
           start_timeout=systemd_app_start_timeout) }}
  when:
    - systemd_app_state == 'present'
    - systemd_app_kind == 'inline'

# Facts and registers both persist for the rest of the play, and this role runs once
# per app, so everything path-shaped is cleared here — an app must never inherit
# another app's paths from an earlier invocation in the same run, least of all into a
# task that deletes them. systemd_app_route_clash has already been consumed by the assert
# above, and is cleared all the same, so nothing added later can read another app's result.
#
# The install registers are here for a related reason: each is skipped for the kind — or the
# app — that does not use it, so one app's file changes would otherwise decide how the next
# app is reloaded. The two module results are the same: a stale one would reload or restart
# an app that changed nothing. The decrypted values themselves are not a fact at all (see
# systemd_app_secret_values in defaults/main.yml), so there is nothing of theirs to clear.
- name: "Reset install path facts for app {{ systemd_app_name }}"
  ansible.builtin.set_fact:
    systemd_app_manifest: {}
    systemd_app_manifest_plan: {}
    systemd_app_route_clash: {}
    systemd_app_secrets: {}
    systemd_app_quadlet_render: {}
    systemd_app_quadlet_install: {}
    systemd_app_unit_install: {}
    systemd_app_config_deploy: {}
    systemd_app_start_result: {}
    systemd_app_restart_needed: false
    systemd_app_config_changed: false

- name: "Deploy app {{ systemd_app_name }}"
  ansible.builtin.include_tasks: present.yml
  when: systemd_app_state == 'present'

- name: "Decommission app {{ systemd_app_name }}"
  ansible.builtin.include_tasks: absent.yml
  when: systemd_app_state == 'absent'
