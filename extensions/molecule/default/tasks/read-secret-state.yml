# The store and the record, read as one. Every secrets assertion in side_effect.yml
# compares the two against each other, and each stage leaves them in a different state, so
# they are read again per stage rather than once at the top of the play.
- name: List the secrets podman holds
  ansible.builtin.command:
    argv: [podman, secret, ls, --format, "{{ '{{' }}.Name{{ '}}' }}"]
  changed_when: false
  register: molecule_secret_ls

# --showsecret, because the point of these stages is that the value in the store changed —
# which the recorded digest alone cannot show, being written from the declared value
# whether or not podman took it. The labels come in the same JSON: the digest each secret
# carries is the record a later deploy compares against, and the store is the only record.
- name: Inspect every secret this app owns, value included
  ansible.builtin.command:
    argv: "{{ ['podman', 'secret', 'inspect', '--showsecret'] + (molecule_secret_ls.stdout_lines | select('match', '^molsecret-') | list) }}"
  changed_when: false
  register: molecule_secret_inspect

# secret_state is the scenario's own filter (filter_plugins/); the assertions compare its
# result with declared_secret_state of the values the stage deployed.
- name: Collect the store and the record for the assertions that follow
  ansible.builtin.set_fact:
    molecule_secret_state: "{{ molecule_secret_inspect.stdout | secret_state }}"
