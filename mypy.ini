# The type check runs beside the unit tests, on the developer's machine and in CI; nothing
# here reaches a managed host. The modules still have to run on the oldest Python
# ansible-core 2.19 targets, 3.9, which is below what mypy will check against: so the
# modules keep `from __future__ import annotations` and use the newer syntax only inside
# annotations, and the sanity `compile` test is what holds them to 3.9.
[mypy]
python_version = 3.10
files = plugins, extensions/molecule/default/filter_plugins, tests/unit
# tests/unit is a module root so `from conftest import ...` resolves, and the checkout root
# is the other so the plugins are addressable below as plugins.*.
mypy_path = tests/unit
explicit_package_bases = True
strict = True
# The tests and their helpers are not annotated; their bodies are still checked. The plugins
# are, below.
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False

[mypy-plugins.*,extensions.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# ansible-core ships no py.typed marker, so AnsibleModule and AnsibleFilterError are Any.
# PyYAML's stubs would only make safe_load return Any, which is what the tests get anyway.
[mypy-ansible.*,yaml]
ignore_missing_imports = True
