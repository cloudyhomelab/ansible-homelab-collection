galaxy_info:
  role_name: systemd_app
  namespace: binarycodes
  author: binarycodes
  description: >-
    Deploy or decommission one app: either install its Podman Quadlet files, systemd
    units, and config from a source directory (kind=source), or render a
    single-container Quadlet from call-site params (kind=inline). Optionally registers
    a Caddy route.
  license: GPL-3.0-or-later
  # Kept in step with meta/runtime.yml at the collection root, which carries the reason
  # for the number and names the CI matrix that tests it.
  min_ansible_version: "2.19"

  # Only what the molecule scenario converges: nothing in the role is distribution-specific
  # — it installs unit files, calls podman and drives systemd — but a platform listed here
  # is a promise, and the two below are the ones that promise is tested against, once per
  # row of .github/workflows/molecule.yml. Debian 12 is out because its podman (4.3) predates
  # Quadlet (4.4) and the secret labels the role relies on (4.5); a healthcheck additionally
  # needs podman 5.0 (see the role README). EL and
  # Ubuntu would probably work and are not claimed until something converges them. Adding a
  # platform means a Dockerfile in the scenario and a matrix row as well as an entry here.
  # Rootful podman is a requirement either way.
  #
  # Fedora is the release the scenario's image is pinned to, not `all`: every supported
  # Fedora ships a podman new enough, but only this one has been converged. It moves when
  # the image tag in the scenario and the matrix row move, and not otherwise.
  platforms:
    - name: Fedora
      versions: ["43"]
    - name: Debian
      versions: [trixie]

  galaxy_tags:
    - podman
    - quadlet
    - systemd
    - containers
    - caddy

# The collection declares community.sops in galaxy.yml, which is what installs it for a
# consumer; a role-level dependency would install nothing here and duplicate the pin.
dependencies: []
