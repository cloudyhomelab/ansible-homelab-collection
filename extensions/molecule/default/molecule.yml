# The systemd_app role writes Quadlet files, drives systemctl and calls podman as root,
# so the target has to be a host with systemd as PID 1 and podman on it — nothing about
# the role can be exercised against a plain container. Hence one privileged container
# running /sbin/init, with podman inside it (see Dockerfile.j2).
driver:
  name: podman

platforms:
  - name: systemd-app
    # The newest released Fedora, and released is the load-bearing word: 44 is what
    # `latest` currently points at and 45 is rawhide, neither of which carries a version
    # label. Rawhide is already on Python 3.15, which dropped `dataclasses._is_type` — and
    # ansible-core patches that function unconditionally when module_utils is imported
    # (compat/typing.py, through an unguarded getattr, in 2.19 through 2.21 alike). On such
    # a target every module dies before it runs, which surfaces as "Module result
    # deserialization failed: No start of json char found" rather than as a version
    # problem. Bump this only to a tag that has shipped.
    image: quay.io/fedora/fedora:43
    # Built from Dockerfile.j2 rather than pulled ready-made: the base image ships
    # neither systemd nor podman nor python3, and all three are preconditions here.
    pre_build_image: false
    # Podman turns on its systemd mode when the command is an init, which is what mounts
    # /run and sets up the cgroup hierarchy the units below need.
    command: /sbin/init
    # Rootful podman inside a container needs it: mount, cgroup and namespace operations
    # that no capability set short of privileged allows. The container is throwaway.
    privileged: true

# No roles_path or filter_plugins to set: converge.yml names the role by FQCN and lets
# ANSIBLE_COLLECTIONS_PATH resolve it, which is what a consuming play does. Molecule does
# not install the collection under test, so the checkout has to be laid out as one — see
# this scenario's README.
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        # The fixture apps tree, copied out of the scenario by prepare.yml so the
        # side-effect play can drop a file from it without touching the repository.
        molecule_fixture_source: "{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}/apps"
        molecule_apps_dir: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/apps"
        # A few megabytes, and already on the host by the time any unit starts (prepare.yml
        # pulls it), so a registry hiccup fails the run before the role is under test.
        molecule_image: quay.io/libpod/alpine:latest

        # The role's inputs that name the consumer's fleet rather than an app. Set here,
        # once, exactly as a consuming play sets them.
        systemd_app_apps_dir: "{{ molecule_apps_dir }}"
        # No netavark in the critical path: see apps/molsource/quadlet/molsource.container.
        systemd_app_network: none
        # Somewhere to write route snippets that is not a real reverse proxy's config tree.
        systemd_app_caddy_confd: /var/app/molproxy/config/conf.d

        # The recipient of sops/age-key.txt, which this scenario encrypts its fixture
        # secrets to. Only prepare.yml and side_effect.yml use it; the role decrypts.
        molecule_sops_recipient: age17svute832444rnpteey2lapzwac3k80efzwcxlm0ypu29c0tvcuq43g9uw
        # The fixture app's secrets in plaintext, encrypted into the copied app tree by
        # prepare.yml. Kept here rather than in an encrypted file under version control so
        # that what the store is asserted to hold is readable next to the assertion, and so
        # no ciphertext has to be regenerated by hand when a value changes.
        molecule_secrets:
          molsecret-token: first-token-value
          molsecret-extra: second-value
        # What side_effect.yml re-encrypts over it: one value changed and one name gone, so
        # a single re-deploy covers both the rm-then-create rotation and the drop.
        molecule_secrets_rotated:
          molsecret-token: rotated-token-value

# sops finds the identity through its own environment variable, not through an option on
# the task: the call that needs it is the role's own community.sops.load_vars, and a
# consumer supplies the key the same way. Interpolated by molecule, which resolves
# MOLECULE_* before the provisioner runs; prepare.yml asserts the result is a real file, so
# a config that failed to interpolate says so instead of failing later inside sops.
ansible:
  env:
    SOPS_AGE_KEY_FILE: ${MOLECULE_SCENARIO_DIRECTORY}/sops/age-key.txt

# verify runs before side_effect, unlike the default sequence: verify asserts what a
# converge leaves behind, and side_effect then walks the app through the rest of its
# lifecycle — prune, kind flip, decommission — asserting each step as it goes.
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - side_effect
    - destroy

verifier:
  name: ansible
