# Notified by a role-prefixed topic, for the reason given in the systemd_app role's handlers:
# handler names are global to the play, and only one of two with the same name runs.
- name: Reload systemd slice definitions
  listen: systemd_slices reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
