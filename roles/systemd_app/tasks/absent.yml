# Decommission an app: stop its units, then remove everything it owns on the host —
# Quadlet files, plain systemd units, its config/data directory, and its Caddy route.
# This is destructive and not reversible; back the app up before setting state=absent.
#
# The install dirs are shared with every other app, so nothing there is removed by
# pattern: what goes is exactly the set of paths the last deploy recorded in the host
# install manifest, whichever kind wrote it. Teardown therefore needs no controller-side
# apps/<name>/ tree at all. {{ systemd_app_home }} is this app's alone, so it
# goes wholesale. Podman named volumes and networks declared by an app's Quadlet files
# are NOT removed — they outlive the units that created them, and Caddy's TLS
# certificates live in one. Remove those by hand (`podman volume rm`) once you are sure.

# The removal call below, forced into check mode: what the record lists is also what has to
# be stopped, and the units must go while their files still exist. A record the module
# refuses fails here, before anything is stopped.
- name: "Read recorded install manifest for app {{ systemd_app_name }}"
  binarycodes.homelab.install_manifest:
    path: "{{ systemd_app_manifest_file }}"
    system_dir: "{{ systemd_app_system_dir }}"
    unit_dir: "{{ systemd_app_unit_dir }}"
    config_dir: "{{ systemd_app_home }}/config"
    state: absent
  check_mode: true
  changed_when: false
  register: systemd_app_manifest

# Stop while the generated units still exist; stopping a Quadlet service also
# removes its container (ExecStopPost). Tolerate a unit that was never deployed
# (or already removed) so a repeat decommission stays green.
#
# The manifest is consulted as well as systemd_app_managed_units, and this is the
# difference between a decommission and an orphan. Unit names are an input to the role,
# and a caller who deployed a 'source' app with systemd_app_enable_units but does not
# repeat it here would otherwise have every unit file deleted while the containers keep
# running: the generated service vanishes from systemd's view, its ExecStopPost never
# fires, and nothing is left that names the container. The manifest is on the host and
# needs no input, so it answers what the call did not (see the module's `units` return).
- name: "Stop units for app {{ systemd_app_name }}"
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
  loop: "{{ (systemd_app_managed_units + (systemd_app_manifest.units | default([]))) | unique | sort }}"
  register: systemd_app_stop_result
  failed_when:
    - systemd_app_stop_result is failed
    - "'not loaded' not in (systemd_app_stop_result.msg | default('') | lower)"
    - "'could not find' not in (systemd_app_stop_result.msg | default('') | lower)"

# While the unit files still exist: `systemctl disable` removes the `.wants/` symlinks the
# file's [Install] section names, and can only do so while it can read that file. A separate
# task from the stop, because the systemd module disables before it stops and fails out on
# the first refusal, which for a Quadlet service would leave it running. The same tolerated
# failures as present.yml's enable and disable, plus a unit already gone: a repeat
# decommission has nothing to disable and must stay green.
- name: "Disable units for app {{ systemd_app_name }}"
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
  loop: "{{ (systemd_app_managed_units + (systemd_app_manifest.units | default([]))) | unique | sort }}"
  register: systemd_app_disable_result
  failed_when:
    - systemd_app_disable_result is failed
    - "'transient or generated' not in (systemd_app_disable_result.msg | default(''))"
    - "'no installation config' not in (systemd_app_disable_result.msg | default('') | lower)"
    - "'not loaded' not in (systemd_app_disable_result.msg | default('') | lower)"
    - "'could not find' not in (systemd_app_disable_result.msg | default('') | lower)"
    - "'does not exist' not in (systemd_app_disable_result.msg | default('') | lower)"

# Kept alongside the manifest removal below, rather than folded into it: an 'inline' app
# last deployed before the role recorded manifests for that kind has none, and its
# rendered Quadlet would otherwise be left behind on the host forever. Removing a path
# that is already gone is a no-op, so the overlap costs nothing.
- name: "Remove rendered Quadlet for container {{ systemd_app_name }}"
  ansible.builtin.file:
    path: "{{ systemd_app_system_dir }}/{{ systemd_app_name }}.container"
    state: absent
  when: systemd_app_kind == 'inline'
  notify: systemd_app reload systemd

# Everything the record names, and the record itself. The install dirs are shared with every
# other app, so this removes by list, never by pattern.
- name: "Remove installed files for app {{ systemd_app_name }}"
  binarycodes.homelab.install_manifest:
    path: "{{ systemd_app_manifest_file }}"
    system_dir: "{{ systemd_app_system_dir }}"
    unit_dir: "{{ systemd_app_unit_dir }}"
    config_dir: "{{ systemd_app_home }}/config"
    state: absent
  notify: systemd_app reload systemd

# Podman secrets are host-global, so they are not part of the tree removed below. The
# module removes every secret labelled as this app's, which needs nothing from the
# controller — the app's source tree may be gone — and refuses to touch another app's. A
# repeat decommission finds nothing labelled and changes nothing.
#
# Releases before 1.1.0 recorded which secrets an app owned in a file rather than as a label
# on each secret, so the module cannot know a secret stored that way is this app's without
# being told: it reads the record's keys as names to adopt. Before the home that holds the
# record is removed, and a missing record, which is every app deployed since, adds nothing.
# Remove `adopt_file` at 2.0.0.
- name: "Remove podman secrets of app {{ systemd_app_name }}"
  binarycodes.homelab.podman_secrets:
    app: "{{ systemd_app_name }}"
    state: absent
    adopt_file: "{{ systemd_app_home }}/.secret-digests"

# The one task in this role that removes a directory tree, so the composed path is
# re-checked here rather than trusted from main.yml's input validation. A name with a
# slash or a leading dot would make this reach systemd_app_root itself, taking
# every other app's config and data with it.
- name: "Verify the home directory to remove belongs to app {{ systemd_app_name }}"
  ansible.builtin.assert:
    that:
      - systemd_app_name | binarycodes.homelab.app_validation_errors(kind=systemd_app_kind, state='absent') | length == 0
      - systemd_app_home == systemd_app_root ~ '/' ~ systemd_app_name
      - systemd_app_home != systemd_app_root
    fail_msg: >-
      Refusing to remove {{ systemd_app_home }}: an app's home must be exactly one named
      child of {{ systemd_app_root }}, and '{{ systemd_app_name }}' does not compose one.
    quiet: true

# The manifest went with the files above; what is left in this tree is the deployed config,
# and whatever the app wrote under its home.
- name: "Remove config and data of app {{ systemd_app_name }}"
  ansible.builtin.file:
    path: "{{ systemd_app_home }}"
    state: absent

# Caddy route snippet, if the app registered one. It lives in reverse_proxy's config
# tree, not this app's, so it needs removing explicitly. The route stops resolving when
# the deploy playbook reloads Caddy (post-task), as on the present path.
- name: "Remove Caddy route for {{ systemd_app_name }}"
  ansible.builtin.file:
    path: "{{ systemd_app_caddy_confd }}/{{ systemd_app_name }}.caddy"
    state: absent

# Forget the now-removed generated units. Notified handler runs here, not at end
# of play.
- name: Apply unit changes (systemd daemon-reload)
  ansible.builtin.meta: flush_handlers
