---
removed_features:
  - The ``podman_secrets`` module's ``adopt_file`` option is removed, and the ``systemd_app``
    role no longer reads or removes the ``.secret-digests`` file releases before 1.1.0 kept in
    an app's home.
breaking_changes:
  - An app last deployed with a release before 1.1.0 should be deployed once with the latest
    1.x release before upgrading. 2.0.0 still labels the secrets an app declares, but no longer
    finds the unlabelled ones it stopped declaring or, on ``state=absent``, any it never
    labelled, so those would stay in the podman store.
