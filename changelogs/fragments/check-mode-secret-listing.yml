bugfixes:
  - >-
    The ``systemd_app`` role no longer reports storing every declared podman secret when
    run under ``--check``. The store listing it reconciles against is a read-only command,
    which Ansible skipped in check mode, leaving the role unable to distinguish an empty
    store from an unasked question; it now runs in check mode too. Storing and removing a
    secret still cannot be previewed, and the role's README says so.
