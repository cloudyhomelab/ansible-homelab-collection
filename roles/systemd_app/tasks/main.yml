# Deploys (present) or decommissions (absent) one app, of either kind. See README and
# defaults/main.yml.

# The conditional requirements cannot go in meta/argument_specs.yml, which can only mark an
# option required outright. A 'source' app's directory is checked here, before anything is
# touched; source_tree refuses a missing one too, but is first read after the secrets.
# Nothing here interpolates systemd_app_name, so an unusable name fails this task rather than
# its title. Secret keys only, and only on present: a decommission must not need the key.
- name: Validate role input
  ansible.builtin.assert:
    that:
      - systemd_app_app_validation_errors | length == 0
    fail_msg: >-
      The 'systemd_app' role cannot act on this app as given:
      {{ systemd_app_app_validation_errors | join('; ') }}.
    quiet: true
  vars:
    systemd_app_app_validation_errors: >-
      {{ systemd_app_name | default('') | binarycodes.homelab.app_validation_errors(
           kind=systemd_app_kind | default(''),
           state=systemd_app_state,
           image=systemd_app_image | default(''),
           apps_dir=systemd_app_apps_dir | default(''),
           data_dirs=systemd_app_data_dirs,
           secret_names=(systemd_app_secret_values | list) if systemd_app_state == 'present' else []) }}

# Two files decrypting to one name would leave whichever the host's decrypt unit reached last.
# Caught here, by the filter applying the same rules the helper does, so it is a failed play
# rather than a failed unit.
- name: "Verify the private files of app {{ systemd_app_name }}"
  ansible.builtin.assert:
    that:
      - systemd_app_private_tree.errors | length == 0
    fail_msg: >-
      App {{ systemd_app_name }} cannot install its private files as given:
      {{ systemd_app_private_tree.errors | join('; ') }}.
    quiet: true
  when: systemd_app_state == 'present'

# These are interpolated into generated files, not passed to a module, so nothing fails at
# write time: Caddy refuses a whole imported config over one bad domain, and systemd
# mis-parses an Environment= line without complaining. See each filter's own docs.
- name: "Verify the route inputs of app {{ systemd_app_name }}"
  ansible.builtin.assert:
    that:
      - systemd_app_route_validation_errors | length == 0
    fail_msg: >-
      App {{ systemd_app_name }} cannot be routed as given:
      {{ systemd_app_route_validation_errors | join('; ') }}.
    quiet: true
  vars:
    systemd_app_route_validation_errors: >-
      {{ systemd_app_domain | binarycodes.homelab.route_validation_errors(systemd_app_upstream, systemd_app_port) }}
  when:
    - systemd_app_state == 'present'
    - systemd_app_domain is defined
    - systemd_app_domain | string | length > 0

# The one route problem a filter cannot see: two apps on one domain write two site blocks with
# one address, which Caddy refuses, taking every other app's route down with it. The role sees
# one app at a time, so the question goes to the host. `contains` matches per line from the
# start, where the role writes the address; a hand-written snippet listing several addresses
# on one line is `caddy validate`'s job in the consuming play.
- name: "Look for another app's route on the domain of {{ systemd_app_name }}"
  ansible.builtin.find:
    paths: "{{ systemd_app_caddy_confd }}"
    patterns: '*.caddy'
    excludes: "{{ systemd_app_name }}.caddy"
    contains: '^\s*{{ systemd_app_domain | regex_escape }}\s*\{'
    file_type: file
  register: systemd_app_route_clash
  when:
    - systemd_app_state == 'present'
    - systemd_app_domain is defined
    - systemd_app_domain | string | length > 0

- name: "Refuse a domain another app already routes: {{ systemd_app_name }}"
  ansible.builtin.assert:
    that:
      - systemd_app_route_clash.files | default([]) | length == 0
    fail_msg: >-
      App {{ systemd_app_name }} cannot take {{ systemd_app_domain }}: it is already the
      address of a site block in
      {{ systemd_app_route_clash.files | default([]) | map(attribute='path') | join(', ') }}.
      Two site blocks with one address make Caddy refuse the whole imported config, taking
      every app's route down. Change one domain, or decommission the other app first.
    quiet: true
  when:
    - systemd_app_state == 'present'
    - systemd_app_domain is defined
    - systemd_app_domain | string | length > 0

- name: "Verify the rendered container inputs of app {{ systemd_app_name }}"
  ansible.builtin.assert:
    that:
      - systemd_app_container_validation_errors | length == 0
    fail_msg: >-
      App {{ systemd_app_name }} has values that would not survive into its Quadlet:
      {{ systemd_app_container_validation_errors | join('; ') }}.
    quiet: true
  vars:
    # Named rather than positional: every value inline.container.j2 interpolates is here,
    # and which one is missing has to be visible at a glance when the template gains a line.
    systemd_app_container_validation_errors: >-
      {{ systemd_app_env | binarycodes.homelab.container_validation_errors(
           description=systemd_app_description | default(''),
           volumes=systemd_app_volumes,
           publish_ports=systemd_app_publish_ports,
           container_options=systemd_app_container_options,
           service_options=systemd_app_service_options,
           image=systemd_app_image | default(''),
           network=systemd_app_network,
           health_cmd=systemd_app_health_cmd,
           health_interval=systemd_app_health_interval,
           health_retries=systemd_app_health_retries,
           health_start_period=systemd_app_health_start_period,
           start_timeout=systemd_app_start_timeout,
           auto_update=systemd_app_auto_update,
           restart=systemd_app_restart) }}
  when:
    - systemd_app_state == 'present'
    - systemd_app_kind == 'inline'

# Facts and registers persist for the play and this role runs once per app, so an app could
# otherwise inherit another's paths — into a task that deletes them. The install registers are
# here for a related reason: each is skipped for the kind or the app that does not use it, so
# a stale one would decide how the next app is restarted. tests/unit/test_fact_reset.py holds
# this list to what the tasks actually register.
- name: "Reset install path facts for app {{ systemd_app_name }}"
  ansible.builtin.set_fact:
    systemd_app_manifest: {}
    systemd_app_manifest_plan: {}
    systemd_app_route_clash: {}
    systemd_app_secrets: {}
    systemd_app_quadlet_render: {}
    systemd_app_quadlet_install: {}
    systemd_app_unit_install: {}
    systemd_app_config_deploy: {}
    systemd_app_private_tools: {}
    systemd_app_helper_install: {}
    systemd_app_private_unit_install: {}
    systemd_app_private_deploy: {}
    systemd_app_dropin_deploy: {}
    systemd_app_start_result: {}
    systemd_app_restart_needed: false
    systemd_app_config_changed: false

- name: "Deploy app {{ systemd_app_name }}"
  ansible.builtin.include_tasks: present.yml
  when: systemd_app_state == 'present'

- name: "Decommission app {{ systemd_app_name }}"
  ansible.builtin.include_tasks: absent.yml
  when: systemd_app_state == 'absent'
