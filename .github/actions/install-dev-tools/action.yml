# The one way the workflows install the development tools, so requirements-dev.txt is the
# only place their versions are written down. Injected into the runner image's own
# ansible-core venv, so ansible-lint and molecule run against the very ansible-core a
# consumer would use, the one that sees the collection.
#
# Installed with the venv's own pip, which resolves the `-r` that pulls requirements-test.txt
# in. The venv's bin directory then goes on PATH, which takes the list whole, packages with no
# entry point (PyYAML, the molecule driver) included. The path is resolved from where this
# action was checked out, because a composite action's steps do not inherit the job's
# working-directory default and two of the callers check the collection out under
# ansible_collections/.
name: Install the development tools
description: >-
  Inject requirements-dev.txt into the runner's ansible-core pipx venv and put that venv's
  programs on PATH.

runs:
  using: composite
  steps:
    - name: Install the pinned tools into the ansible-core venv
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: |
        venv="$(pipx environment --value PIPX_LOCAL_VENVS)/ansible-core"
        "$venv/bin/python" -m pip install -r requirements-dev.txt
        echo "$venv/bin" >> "$GITHUB_PATH"
