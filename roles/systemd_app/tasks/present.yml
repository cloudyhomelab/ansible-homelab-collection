# Secrets: an app that needs any ships apps/<app>/secrets.sops.yaml, keyed by the podman
# secret names. Found rather than declared, like the app's quadlet/ and config/
# directories, so that file is the only place the set is written down. Decrypted on the
# controller by the lookup behind systemd_app_secret_values (see defaults/main.yml), which
# is why no task here loads anything: the values are evaluated where they are used and are
# never a fact. First in the file because an 'inline' app's Quadlet is rendered from those
# names below. no_log, because the loop items carry the values and the deploy runs with -v.
- name: "Verify every secret can be stored for app {{ systemd_app_name }}"
  ansible.builtin.assert:
    that:
      # Passed to `podman secret` as root, and useful only if a Quadlet can reference it.
      - item.key is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
      # An 'inline' app's Secret= line is rendered from this key, so the key also has to
      # spell a legal environment variable once upper-cased — no dots, no leading digit.
      - systemd_app_kind != 'inline' or item.key is match('^[A-Za-z][A-Za-z0-9-]*$')
      # Refused here rather than at container start, where an empty value surfaces as the
      # app failing to boot with no explanation of why.
      - item.value is not none and (item.value | string | length > 0)
    fail_msg: >-
      {{ systemd_app_name }}/secrets.sops.yaml must map podman secret names (letters,
      digits, dot, dash or underscore, not starting with a dot) to non-empty values. For an
      'inline' app the name is also the variable the container sees, upper-cased with
      dashes as underscores, so it is limited to letters, digits and dashes.
    quiet: true
  loop: "{{ systemd_app_secret_values | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

# 'inline' kind: render the single-container Quadlet from call-site params. 'source'
# kind installs its container from a file instead (the copy tasks below).
- name: "Render Quadlet for container {{ systemd_app_name }}"
  ansible.builtin.template:
    src: inline.container.j2
    dest: "{{ systemd_app_system_dir }}/{{ systemd_app_name }}.container"
    owner: "{{ systemd_app_owner }}"
    group: "{{ systemd_app_group }}"
    mode: "{{ systemd_app_file_mode }}"
  when: systemd_app_kind == 'inline'
  register: systemd_app_quadlet_render
  notify: systemd_app reload systemd

- name: "Install Quadlet files for app {{ systemd_app_name }}"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ systemd_app_system_dir }}/"
    owner: "{{ systemd_app_owner }}"
    group: "{{ systemd_app_group }}"
    mode: "{{ systemd_app_file_mode }}"
  loop: "{{ systemd_app_source_quadlet_files }}"
  when: systemd_app_kind == 'source'
  register: systemd_app_quadlet_install
  notify: systemd_app reload systemd

- name: "Install systemd units for app {{ systemd_app_name }}"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ systemd_app_unit_dir }}/"
    owner: "{{ systemd_app_owner }}"
    group: "{{ systemd_app_group }}"
    mode: "{{ systemd_app_file_mode }}"
  loop: "{{ systemd_app_source_unit_files }}"
  when: systemd_app_kind == 'source'
  register: systemd_app_unit_install
  notify: systemd_app reload systemd

- name: "Check for config directory of app {{ systemd_app_name }}"
  ansible.builtin.stat:
    path: "{{ systemd_app_source_config_dir }}"
  delegate_to: localhost
  become: false
  register: systemd_app_config_dir

# Recursive, because a config tree nests and fileglob sees only one level down. The
# manifest has to list every file the copy below installs, or the next deploy prunes
# something it should have kept.
- name: "Find config files of app {{ systemd_app_name }}"
  ansible.builtin.find:
    paths: "{{ systemd_app_source_config_dir }}"
    recurse: true
    hidden: true
    file_type: file
  delegate_to: localhost
  become: false
  register: systemd_app_config_found
  when:
    - systemd_app_kind == 'source'
    - systemd_app_config_dir.stat.exists
    - systemd_app_config_dir.stat.isdir

- name: "Deploy config tree for app {{ systemd_app_name }}"
  ansible.builtin.copy:
    src: "{{ systemd_app_source_config_dir }}/"
    dest: "{{ systemd_app_home }}/config/"
    owner: "{{ systemd_app_owner }}"
    group: "{{ systemd_app_group }}"
    mode: "{{ systemd_app_file_mode }}"
    directory_mode: "{{ systemd_app_dir_mode }}"
  when:
    # Shipping files from the repo is what makes an app 'source'; an 'inline' app is
    # defined entirely at the call site and has no config tree to copy.
    - systemd_app_kind == 'source'
    - systemd_app_config_dir.stat.exists
    - systemd_app_config_dir.stat.isdir
  register: systemd_app_config_deploy

# The config copy above creates this, but only for an app that ships a config tree. Every
# app owns host state below it regardless: the install manifest recorded just below, and
# for some also a bind-mounted data directory.
- name: "Ensure the home directory exists for app {{ systemd_app_name }}"
  ansible.builtin.file:
    path: "{{ systemd_app_home }}"
    state: directory
    owner: "{{ systemd_app_owner }}"
    group: "{{ systemd_app_group }}"
    mode: "{{ systemd_app_dir_mode }}"

# Files the last deploy installed that this one does not — renamed, dropped from the app's
# source tree, or belonging to the kind the app has just stopped being — are still live host
# state if left behind: the Quadlet generator keeps making services from stale unit files,
# and stale config keeps being mounted. One module call reads what the last deploy recorded,
# prunes the difference, and records this deploy, after the installs above so the app is
# never left without its files. The record is read for either kind, which is what makes a
# change of kind converge: the paths a 'source' deploy recorded are exactly what the 'inline'
# one it became has to prune, and the other way round. What the module refuses to act on,
# and why, is in its own docs (`ansible-doc binarycodes.homelab.install_manifest`).
#
# A unit whose file is pruned while it is running keeps running until it is stopped or the
# host reboots, so converting an app that shipped several units means stopping the ones it
# no longer ships by hand, once. See README.
#
# The generated Caddy route is deliberately not recorded. It lives in the reverse proxy's
# config tree rather than this app's, so it is outside what the module admits, and
# absent.yml removes it by name instead. The reload is notified for a pruned unit file; a
# deploy that only changed the record reloads once for nothing, which costs less than a
# second task to tell the two apart.
- name: "Reconcile the install manifest of app {{ systemd_app_name }}"
  binarycodes.homelab.install_manifest:
    path: "{{ systemd_app_manifest_file }}"
    installed: >-
      {{ systemd_app_inline_installed_paths if systemd_app_kind == 'inline'
         else systemd_app_source_installed_paths }}
    system_dir: "{{ systemd_app_system_dir }}"
    unit_dir: "{{ systemd_app_unit_dir }}"
    config_dir: "{{ systemd_app_home }}/config"
    owner: "{{ systemd_app_owner }}"
    group: "{{ systemd_app_group }}"
    mode: "{{ systemd_app_file_mode }}"
  vars:
    # Every host path this deploy just installed. For 'source': the two flat install dirs by
    # basename, plus the config tree with its relative layout preserved. For 'inline': the
    # one rendered Quadlet.
    systemd_app_inline_installed_paths:
      - "{{ systemd_app_system_dir }}/{{ systemd_app_name }}.container"
    systemd_app_source_installed_paths: >-
      {{ ([systemd_app_system_dir] | product(systemd_app_source_quadlet_files | map('basename') | list) | map('join', '/') | list)
         + ([systemd_app_unit_dir] | product(systemd_app_source_unit_files | map('basename') | list) | map('join', '/') | list)
         + ([systemd_app_home ~ '/config'] | product(systemd_app_config_found.files | default([])
            | map(attribute='path') | map('relpath', systemd_app_source_config_dir) | list) | map('join', '/') | list) }}
  register: systemd_app_manifest
  notify: systemd_app reload systemd

# Bind-mount targets the app itself writes to, named relative to the app's home.
# Podman creates a missing host path as root:root, which an unprivileged container cannot
# write in, so the directory is made here with the owner the image runs as. The deploy
# would not notice otherwise: the mount succeeds either way, and only the app hits the
# failure, later, when it tries to write.
- name: "Verify data directories are relative paths for app {{ systemd_app_name }}"
  ansible.builtin.assert:
    that:
      # Created as root with a caller-supplied owner, and removed with the state tree on
      # absent, so a path that climbed out of this app's own directory would hand another
      # app's data away — or take it with it. Relative and '..'-free is what makes that
      # impossible, rather than a prefix check on a path the caller composed.
      - item.path is string
      - not item.path.startswith('/')
      - item.path.split('/') | intersect(['', '.', '..']) | length == 0
    fail_msg: >-
      Refusing to create '{{ item.path | default('(no path)') }}': an entry of
      systemd_app_data_dirs names a path relative to {{ systemd_app_home }} —
      'data', not '/var/app/<app>/data' — and may not climb out of it with '..'.
    quiet: true
  loop: "{{ systemd_app_data_dirs }}"
  loop_control:
    label: "{{ item.path | default('(no path)') }}"

- name: "Ensure data directories exist for app {{ systemd_app_name }}"
  ansible.builtin.file:
    path: "{{ systemd_app_home }}/{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(systemd_app_owner) }}"
    group: "{{ item.group | default(systemd_app_group) }}"
    mode: "{{ item.mode | default(systemd_app_dir_mode) }}"
  loop: "{{ systemd_app_data_dirs }}"
  loop_control:
    label: "{{ item.path }}"

# One module call does the whole of the store: creates what is missing, removes and
# re-creates what changed (podman cannot update a secret in place), drops what the app has
# stopped declaring, and refuses a name another app owns. Ownership and the value's digest
# live as labels on the secret itself, so the store is the only record and a secret removed
# by hand is simply missing and comes back. The values are a no_log parameter, so a podman
# failure is reported with its name, exit code and stderr while the value stays out of the
# log. Registered for the restart decision below: podman reads a secret when it *creates*
# a container, so a changed one is only live once the app is restarted.
- name: "Reconcile podman secrets of app {{ systemd_app_name }}"
  binarycodes.homelab.podman_secrets:
    app: "{{ systemd_app_name }}"
    secrets: "{{ systemd_app_secret_values }}"
  register: systemd_app_secrets

# Written by releases before 1.1.0, which recorded the digests in a file rather than on the
# secrets. The module adopts a secret stored that way on the first deploy after upgrading,
# so the file is not read; it is removed so a backup of the app no longer carries a digest
# of every secret it ever had. Remove this task at 2.0.0.
- name: "Remove the pre-1.1.0 secret digest record of app {{ systemd_app_name }}"
  ansible.builtin.file:
    path: "{{ systemd_app_home }}/.secret-digests"
    state: absent

# Caddy route: only written when the app opts in with systemd_app_domain. The
# snippet is imported by the central Caddyfile, so no daemon-reload is needed and
# Caddy is reloaded once by the deploy playbook (post-task), not by this role.
- name: "Ensure Caddy conf.d directory exists for route of {{ systemd_app_name }}"
  ansible.builtin.file:
    path: "{{ systemd_app_caddy_confd }}"
    state: directory
    owner: "{{ systemd_app_owner }}"
    group: "{{ systemd_app_group }}"
    mode: "{{ systemd_app_dir_mode }}"
  when: systemd_app_domain is defined and (systemd_app_domain | string | length > 0)

- name: "Register Caddy route for {{ systemd_app_name }}"
  ansible.builtin.template:
    src: caddy-site.caddy.j2
    dest: "{{ systemd_app_caddy_confd }}/{{ systemd_app_name }}.caddy"
    owner: "{{ systemd_app_owner }}"
    group: "{{ systemd_app_group }}"
    mode: "{{ systemd_app_file_mode }}"
  when: systemd_app_domain is defined and (systemd_app_domain | string | length > 0)

# Regenerate Quadlet-derived services and pick up new unit files before we
# touch their state. Handlers notified above run here, not at end of play.
- name: Apply unit changes (systemd daemon-reload)
  ansible.builtin.meta: flush_handlers

# Nothing this deploy wrote is live yet, and the two ways it becomes live differ.
#
# A new container is the only way a changed secret or unit definition takes effect: podman
# reads a secret when it *creates* the container, and the daemon-reload above only
# regenerates the service file — systemd never acts on a unit it merely re-read, so the
# container keeps running from the image and options it was created with. 'started' would
# report success on both and leave the app serving the old ones.
#
# Config is different: the file is bind-mounted, so it is already in place and only the
# process needs telling. Which is why this is not folded into the restart above — an app
# whose unit declares ExecReload= means it can take config without dropping what it is
# serving, and cycling it anyway would throw that away.
#
# Files removed by the prune are counted only when they were config, which the manifest
# module reports. A removed unit file leaves nothing to act on; a removed config file is a
# change to what a still-running app reads.
- name: "Decide how this deploy reaches the running units of app {{ systemd_app_name }}"
  ansible.builtin.set_fact:
    systemd_app_restart_needed: >-
      {{ (systemd_app_secrets.changed | default(false))
         or (systemd_app_quadlet_render.changed | default(false))
         or (systemd_app_quadlet_install.changed | default(false))
         or (systemd_app_unit_install.changed | default(false)) }}
    systemd_app_config_changed: >-
      {{ (systemd_app_config_deploy.changed | default(false))
         or (systemd_app_manifest.config_changed | default(false)) }}

# Registered for the reload below: the module returns the unit's `systemctl show`
# properties, so no separate probe is needed to learn whether it can reload.
- name: "Start units for app {{ systemd_app_name }}"
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: "{{ 'restarted' if systemd_app_restart_needed | bool else 'started' }}"
  loop: "{{ systemd_app_managed_units }}"
  register: systemd_app_start_result

# Skipped when the app was restarted just above, which already picked the config up. An
# app whose unit has no ExecReload= reports CanReload=no and is restarted instead — the
# blunt path, but the only one that gets the change into the process.
- name: "Apply changed config to units of app {{ systemd_app_name }}"
  ansible.builtin.systemd:
    name: "{{ item.item }}"
    state: "{{ 'reloaded' if (item.status.CanReload | default('no')) == 'yes' else 'restarted' }}"
  loop: "{{ systemd_app_start_result.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - systemd_app_config_changed | bool
    - not systemd_app_restart_needed | bool

# Quadlet-generated services live in /run and are "transient or generated",
# so `systemctl enable` on them fails — boot persistence comes from their
# [Install] section instead. Tolerate exactly that case; fail on anything else.
- name: "Enable boot-start of units for app {{ systemd_app_name }}"
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
  loop: "{{ systemd_app_managed_units }}"
  register: systemd_app_enable_result
  failed_when:
    - systemd_app_enable_result is failed
    - "'transient or generated' not in (systemd_app_enable_result.msg | default(''))"
    - "'no installation config' not in (systemd_app_enable_result.msg | default('') | lower)"
