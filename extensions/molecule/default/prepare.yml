# Everything the role is entitled to assume about a host, plus the fixtures it deploys from.
- name: Prepare
  hosts: all
  become: true
  gather_facts: false

  tasks:
    # `raw`, so it needs no Python. A target whose interpreter ansible-core cannot drive fails
    # every other task identically and deep in module_utils, so the log opens with the two
    # facts that explain that whole class of failure.
    - name: Record the target's release and interpreter
      ansible.builtin.raw: |
        . /etc/os-release && echo "os: $NAME $VERSION_ID"
        python3 -VV
      changed_when: false
      register: molecule_target_python

    - name: Report the target's release and interpreter
      ansible.builtin.debug:
        msg: "{{ molecule_target_python.stdout_lines | map('trim') | select | list }}"

    # Copied out of the scenario so side_effect.yml can drop a file from an app's tree without
    # editing one under version control.
    - name: Copy the fixture app tree where a converge may mutate it
      ansible.builtin.copy:
        src: "{{ molecule_fixture_source }}/"
        dest: "{{ molecule_apps_dir }}/"
        mode: "0644"
        directory_mode: "0755"
      delegate_to: localhost
      become: false

    # Otherwise this fails deep inside the role, with sops reporting only that it found no
    # identity.
    - name: Assert the scenario's age identity is where sops will look for it
      ansible.builtin.assert:
        that:
          - molecule_age_keyfile | length > 0
          - molecule_age_keyfile is exists
        fail_msg: >-
          SOPS_AGE_KEY_FILE is {{ molecule_age_keyfile | default('unset', true) }}, which is
          not a file. It is set in molecule.yml's ansible.env and has to interpolate to
          {{ molecule_fixture_source | dirname }}/sops/age-key.txt.
        quiet: true
      delegate_to: localhost
      become: false
      vars:
        molecule_age_keyfile: "{{ lookup('ansible.builtin.env', 'SOPS_AGE_KEY_FILE') }}"

    # Private files are decrypted on the target, so it needs the tools. Copied rather than
    # installed there: neither distribution packages sops, and a copy keeps both ends on one
    # version without a pinned download and a checksum per architecture.
    - name: Look for the decrypt tools on the controller
      ansible.builtin.shell: command -v age && command -v sops
      changed_when: false
      failed_when: false
      delegate_to: localhost
      become: false
      register: molecule_controller_tools

    - name: Assert the controller has age and sops
      ansible.builtin.assert:
        that:
          - molecule_controller_tools.rc == 0
        fail_msg: >-
          This scenario needs both age and sops on the controller: sops to encrypt the
          fixture secrets, age the fixture private files, and both are copied to the target,
          which is where the role's decrypt unit runs them. Install them and re-run.
        quiet: true
      delegate_to: localhost
      become: false

    - name: Install the decrypt tools on the target
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/usr/local/bin/{{ item | basename }}"
        owner: root
        group: root
        mode: "0755"
      loop: "{{ molecule_controller_tools.stdout_lines | map('trim') | select | list }}"

    # The role never provisions the key, so the scenario plays the fleet: the same identity
    # sops uses on the controller, where the unit's LoadCredential= expects it.
    - name: Create the directory the host keeps its age identity in
      ansible.builtin.file:
        path: /etc/homelab
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Install the host's age identity where the decrypt unit will load it
      ansible.builtin.copy:
        src: "{{ lookup('ansible.builtin.env', 'SOPS_AGE_KEY_FILE') }}"
        dest: /etc/homelab/age.key
        owner: root
        group: root
        mode: "0400"

    # Nothing but this play puts a key on the target, and the decrypt unit only loads it much
    # later, as a credential. Asserted on the target rather than trusted from the copy above,
    # so a key that did not land is named here instead of surfacing as the helper finding an
    # empty credentials directory in the middle of a converge.
    - name: Stat the age identity on the target
      ansible.builtin.stat:
        path: /etc/homelab/age.key
      register: molecule_target_age_key

    - name: Assert the target carries the identity the decrypt unit will load
      ansible.builtin.assert:
        that:
          - molecule_target_age_key.stat.exists
          - molecule_target_age_key.stat.mode == '0400'
        fail_msg: >-
          /etc/homelab/age.key on the target: exists
          {{ molecule_target_age_key.stat.exists }}, mode
          {{ molecule_target_age_key.stat.mode | default('none') }}.
        quiet: true

    # Neither has a counterpart under the committed apps/ tree: git cannot carry an empty
    # directory, and the files themselves are written below.
    - name: Create the fixture app directories the copied tree needs
      ansible.builtin.file:
        path: "{{ molecule_apps_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - molsecret
        - molinline
      delegate_to: localhost
      become: false

    # Encrypted here rather than committed, so the values are readable next to the assertions
    # about them and no ciphertext is regenerated by hand.
    - name: Encrypt the fixture secrets into the copied tree
      community.sops.sops_encrypt:
        path: "{{ molecule_apps_dir }}/molsecret/secrets.sops.yaml"
        age: ["{{ molecule_sops_recipient }}"]
        content_yaml: "{{ molecule_secrets }}"
        mode: "0600"
      delegate_to: localhost
      become: false

    # Same argument as the secrets above.
    - name: Create the fixture private directories in the copied tree
      ansible.builtin.file:
        path: "{{ (molecule_apps_dir ~ '/' ~ item.app ~ '/private/' ~ item.path) | dirname }}"
        state: directory
        mode: "0755"
      loop: "{{ molecule_private_files }}"
      loop_control:
        label: "{{ item.app }}/{{ item.path }}"
      delegate_to: localhost
      become: false

    - name: Encrypt the fixture private files with sops
      community.sops.sops_encrypt:
        path: "{{ molecule_apps_dir }}/{{ item.app }}/private/{{ item.path }}"
        age: ["{{ molecule_sops_recipient }}"]
        content_text: "{{ item.content }}"
        mode: "0600"
      loop: "{{ molecule_private_files | selectattr('tool', 'equalto', 'sops') | list }}"
      loop_control:
        label: "{{ item.app }}/{{ item.path }}"
      delegate_to: localhost
      become: false

    # Raw age, which community.sops has no module for: the point is a file sops never touched.
    - name: Encrypt the fixture private files with age
      ansible.builtin.command:
        argv:
          - age
          - --encrypt
          - --recipient
          - "{{ molecule_sops_recipient }}"
          - --output
          - "{{ molecule_apps_dir }}/{{ item.app }}/private/{{ item.path }}"
        stdin: "{{ item.content }}"
      loop: "{{ molecule_private_files | selectattr('tool', 'equalto', 'age') | list }}"
      loop_control:
        label: "{{ item.app }}/{{ item.path }}"
      changed_when: true
      delegate_to: localhost
      become: false

    # Units are ordered after basic.target, so a converge racing the boot sees them queued
    # rather than started. 'degraded' is expected: the image masks what a container cannot run.
    #
    # `raw`, not command: failed_when: false has to tolerate that exit status and would
    # otherwise swallow a module that could not run at all, which once hid that every module
    # on the target was broken.
    - name: Wait for systemd to finish booting
      ansible.builtin.raw: systemctl is-system-running --wait
      changed_when: false
      failed_when: false

    # The podman package owns this on a real host, so it is a precondition, not a subject.
    - name: Ensure the Quadlet drop-in directory exists
      ansible.builtin.file:
        path: /etc/containers/systemd
        state: directory
        owner: root
        group: root
        mode: "0755"

    # So a registry problem fails before the role is under test, and no unit start waits on a
    # download.
    - name: Pull the fixture container image
      ansible.builtin.command:
        argv: [podman, pull, "{{ molecule_image }}"]
      changed_when: true
