# Decrypted by the lookup behind systemd_app_secret_values, which is why no task here loads
# anything: the values are evaluated where used and are never a fact. First task in the file,
# so a value the store refuses fails the deploy before any file is installed. Registered for
# the restart decision below — podman reads a secret when it *creates* a container.
- name: "Reconcile podman secrets of app {{ systemd_app_name }}"
  binarycodes.homelab.podman_secrets:
    app: "{{ systemd_app_name }}"
    secrets: "{{ systemd_app_secret_values }}"
  register: systemd_app_secrets

# Pre-1.1.0 recorded digests in a file rather than on the secrets. The module adopts those, so
# the file is not read; it goes so a backup carries no digest of every secret the app ever
# had. Remove at 2.0.0.
- name: "Remove the pre-1.1.0 secret digest record of app {{ systemd_app_name }}"
  ansible.builtin.file:
    path: "{{ systemd_app_home }}/.secret-digests"
    state: absent

# 'inline' only; a 'source' app installs its container from a file (install-source.yml).
- name: "Render Quadlet for container {{ systemd_app_name }}"
  ansible.builtin.template:
    src: inline.container.j2
    dest: "{{ systemd_app_system_dir }}/{{ systemd_app_name }}.container"
    owner: "{{ systemd_app_owner }}"
    group: "{{ systemd_app_group }}"
    mode: "{{ systemd_app_file_mode }}"
  when: systemd_app_kind == 'inline'
  register: systemd_app_quadlet_render
  notify: systemd_app reload systemd

# Included rather than guarded per task: Ansible evaluates `loop` before `when`, so a loop over
# systemd_app_source_tree would read the tree for an 'inline' app too, and that raises.
- name: "Install the files of source app {{ systemd_app_name }}"
  ansible.builtin.include_tasks: install-source.yml
  when: systemd_app_kind == 'source'

# Included on the same grounds as install-source.yml, and before the manifest tasks so the
# drop-ins exist by the time they are recorded.
- name: "Install the private files of app {{ systemd_app_name }}"
  ansible.builtin.include_tasks: install-private.yml
  when: systemd_app_has_private | bool

# install-source.yml creates this only for an app that ships a config tree; every app owns the
# manifest below it regardless.
- name: "Ensure the home directory exists for app {{ systemd_app_name }}"
  ansible.builtin.file:
    path: "{{ systemd_app_home }}"
    state: directory
    owner: "{{ systemd_app_owner }}"
    group: "{{ systemd_app_group }}"
    mode: "{{ systemd_app_dir_mode }}"

# A file the last deploy installed and this one does not is still live host state: the
# generator keeps making services from stale unit files, stale config stays mounted. Pruned
# after the installs, so the app is never without its files.
#
# Check mode first, for the units the prune is about to take the files of: enabling a plain
# unit wrote a `.wants/` symlink, and `systemctl disable` can only remove it while the unit
# file still exists. The same shape absent.yml uses to learn what to stop.
- name: "Plan the install manifest reconciliation of app {{ systemd_app_name }}"
  binarycodes.homelab.install_manifest:
    path: "{{ systemd_app_manifest_file }}"
    installed: "{{ systemd_app_installed_paths }}"
    system_dir: "{{ systemd_app_system_dir }}"
    unit_dir: "{{ systemd_app_unit_dir }}"
    config_dir: "{{ systemd_app_home }}/config"
    private_dir: "{{ systemd_app_private_dir }}"
  check_mode: true
  changed_when: false
  register: systemd_app_manifest_plan

# Disable, not stop: stopping is the caller's job (see README), but a unit whose file is about
# to go must not leave a `.wants/` symlink systemd cannot resolve. Tolerated failures as in the
# enable task below.
- name: "Disable the units no longer shipped by app {{ systemd_app_name }}"
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
  loop: "{{ systemd_app_manifest_plan.pruned_units | default([]) }}"
  register: systemd_app_disable_result
  failed_when:
    - systemd_app_disable_result is failed
    - "'transient or generated' not in (systemd_app_disable_result.msg | default(''))"
    - "'no installation config' not in (systemd_app_disable_result.msg | default('') | lower)"

# The Caddy route is not recorded: it lives in the reverse proxy's tree, outside what the
# module admits, and absent.yml removes it by name.
- name: "Reconcile the install manifest of app {{ systemd_app_name }}"
  binarycodes.homelab.install_manifest:
    path: "{{ systemd_app_manifest_file }}"
    installed: "{{ systemd_app_installed_paths }}"
    system_dir: "{{ systemd_app_system_dir }}"
    unit_dir: "{{ systemd_app_unit_dir }}"
    config_dir: "{{ systemd_app_home }}/config"
    private_dir: "{{ systemd_app_private_dir }}"
    owner: "{{ systemd_app_owner }}"
    group: "{{ systemd_app_group }}"
    mode: "{{ systemd_app_file_mode }}"
  register: systemd_app_manifest
  notify: systemd_app reload systemd

# Made with the owner the image runs as. The deploy would not notice otherwise: the mount
# succeeds either way and only the app hits the failure, later, when it writes. Paths were
# checked relative and '..'-free in main.yml, since one that climbed out would be created as
# root here and removed with the tree on absent.
- name: "Ensure data directories exist for app {{ systemd_app_name }}"
  ansible.builtin.file:
    path: "{{ systemd_app_home }}/{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(systemd_app_owner) }}"
    group: "{{ item.group | default(systemd_app_group) }}"
    mode: "{{ item.mode | default(systemd_app_dir_mode) }}"
  loop: "{{ systemd_app_data_dirs }}"
  loop_control:
    label: "{{ item.path }}"

# Imported by the central Caddyfile, so no daemon-reload; the deploy playbook reloads Caddy
# once, post-task.
- name: "Ensure Caddy conf.d directory exists for route of {{ systemd_app_name }}"
  ansible.builtin.file:
    path: "{{ systemd_app_caddy_confd }}"
    state: directory
    owner: "{{ systemd_app_owner }}"
    group: "{{ systemd_app_group }}"
    mode: "{{ systemd_app_dir_mode }}"
  when: systemd_app_domain is defined and (systemd_app_domain | string | length > 0)

- name: "Register Caddy route for {{ systemd_app_name }}"
  ansible.builtin.template:
    src: caddy-site.caddy.j2
    dest: "{{ systemd_app_caddy_confd }}/{{ systemd_app_name }}.caddy"
    owner: "{{ systemd_app_owner }}"
    group: "{{ systemd_app_group }}"
    mode: "{{ systemd_app_file_mode }}"
  when: systemd_app_domain is defined and (systemd_app_domain | string | length > 0)

# Handlers notified above run here, not at end of play, so the state tasks below see the
# regenerated units.
- name: Apply unit changes (systemd daemon-reload)
  ansible.builtin.meta: flush_handlers

# Nothing this deploy wrote is live yet, and the two ways it becomes live differ.
#
# Restart: a changed secret or unit definition only takes effect in a new container. podman
# reads a secret at container creation, and the daemon-reload above regenerates the service
# file but systemd never acts on a unit it merely re-read.
#
# Reload: config is bind-mounted and already in place, so only the process needs telling. A
# unit with ExecReload= can take it without dropping what it is serving. A pruned config file
# counts as a config change, a pruned unit file leaves nothing to act on.
#
# A changed private file is a restart: its plaintext lives in a RuntimeDirectory the decrypt
# unit destroys and re-creates, so reloading would leave the container on a directory that is
# gone. Its own fact rather than a `vars:` entry on the task below, which ansible-lint
# evaluates as raw text and coerces through `bool` (an error from ansible-core 2.23).
- name: "Decide whether the private files moved for app {{ systemd_app_name }}"
  ansible.builtin.set_fact:
    systemd_app_private_changed: >-
      {{ (systemd_app_private_deploy.changed | default(false))
         or (systemd_app_dropin_deploy.changed | default(false))
         or (systemd_app_private_unit_install.changed | default(false))
         or (systemd_app_helper_install.changed | default(false))
         or (systemd_app_manifest.private_changed | default(false)) }}

- name: "Decide how this deploy reaches the running units of app {{ systemd_app_name }}"
  ansible.builtin.set_fact:
    systemd_app_restart_needed: >-
      {{ (systemd_app_secrets.changed | default(false))
         or (systemd_app_quadlet_render.changed | default(false))
         or (systemd_app_quadlet_install.changed | default(false))
         or (systemd_app_unit_install.changed | default(false))
         or (systemd_app_private_changed | bool) }}
    systemd_app_config_changed: >-
      {{ (systemd_app_config_deploy.changed | default(false))
         or (systemd_app_manifest.config_changed | default(false)) }}

# No state, so the module only reports: it is `systemctl show` for the instance, and the unit
# is a template whose instance is simply inactive when the app has never run.
- name: "Check whether the private decrypt is running for app {{ systemd_app_name }}"
  ansible.builtin.systemd:
    name: "{{ systemd_app_private_unit }}@{{ systemd_app_name }}.service"
  register: systemd_app_private_state
  when: systemd_app_has_private | bool

# A try-restart: RemainAfterExit means a running instance must be restarted to re-read what
# this deploy installed, but an instance that is not running is left alone rather than started.
# Deploying an app is not starting it, and Requires= pulls a fresh instance in if a unit does
# start. Before the app's own units, so a failed decrypt is reported as itself rather than as
# every unit failing its Requires=.
- name: "Re-decrypt the private files of app {{ systemd_app_name }}"
  ansible.builtin.systemd:
    name: "{{ systemd_app_private_unit }}@{{ systemd_app_name }}.service"
    state: restarted
  when:
    - systemd_app_has_private | bool
    - systemd_app_restart_needed | bool
    - (systemd_app_private_state.status.ActiveState | default('inactive')) == 'active'

# An app that stopped shipping private files: its copies and drop-ins are pruned above, but
# the instance they pulled in keeps holding a tmpfs tree of plaintext for files that are gone.
# Only when the manifest just pruned under private/, so this is not a systemd call per deploy
# for every app that never had any.
- name: "Stop the private decrypt of app {{ systemd_app_name }}"
  ansible.builtin.systemd:
    name: "{{ systemd_app_private_unit }}@{{ systemd_app_name }}.service"
    state: stopped
  when:
    - not systemd_app_has_private | bool
    - systemd_app_manifest.private_changed | default(false) | bool
  register: systemd_app_private_stop
  failed_when:
    - systemd_app_private_stop is failed
    - "'not loaded' not in (systemd_app_private_stop.msg | default('') | lower)"
    - "'could not find' not in (systemd_app_private_stop.msg | default('') | lower)"

# Registered for the reload below: the module returns `systemctl show` properties, so no
# separate probe is needed to learn whether a unit can reload.
- name: "Start units for app {{ systemd_app_name }}"
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: "{{ 'restarted' if systemd_app_restart_needed | bool else 'started' }}"
  loop: "{{ systemd_app_managed_units }}"
  register: systemd_app_start_result

# Skipped when the restart above already picked the config up. A unit with no ExecReload=
# reports CanReload=no and is restarted instead.
- name: "Apply changed config to units of app {{ systemd_app_name }}"
  ansible.builtin.systemd:
    name: "{{ item.item }}"
    state: "{{ 'reloaded' if (item.status.CanReload | default('no')) == 'yes' else 'restarted' }}"
  loop: "{{ systemd_app_start_result.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - systemd_app_config_changed | bool
    - not systemd_app_restart_needed | bool

# A Quadlet-generated service is "transient or generated" and cannot be enabled; its boot
# persistence comes from [Install]. Tolerate exactly that, fail on anything else.
- name: "Enable boot-start of units for app {{ systemd_app_name }}"
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
  loop: "{{ systemd_app_managed_units }}"
  register: systemd_app_enable_result
  failed_when:
    - systemd_app_enable_result is failed
    - "'transient or generated' not in (systemd_app_enable_result.msg | default(''))"
    - "'no installation config' not in (systemd_app_enable_result.msg | default('') | lower)"
