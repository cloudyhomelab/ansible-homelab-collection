# The checkout root on sys.path, so a test imports a plugin as plugins.filter.<name> or
# plugins.modules.<name>: a directory needs no __init__.py to be imported through, and mypy
# resolves the same name to the same file, which is what lets it check the tests' calls.
[pytest]
pythonpath = .
