minor_changes:
  - >-
    New module ``podman_secrets``: reconciles one app's podman secrets against the store in
    one call, creating what is missing, rotating what changed, removing what the app stopped
    declaring, and refusing a name another app owns. Ownership and a digest of each value
    (``sha256:<hex>``) are recorded as labels on the secret itself, so the store is the only record and a secret
    removed by hand is re-created on the next run. Supports check mode and diff mode; no
    return value carries a secret. The ``systemd_app`` role now uses it for its secrets.
  - >-
    The ``systemd_app`` role decrypts an app's ``secrets.sops.yaml`` through the
    ``community.sops.sops`` lookup, evaluated where the values are used, instead of loading
    them into a fact that persisted for the rest of the play.
major_changes:
  - >-
    On the first deploy after upgrading, the ``systemd_app`` role removes and re-creates every
    podman secret an app declares, so that each carries its ownership and digest labels, and
    restarts the app once. Secrets stored by earlier releases carry no labels, so the role
    cannot tell whether their values still match and treats them as changed. Plan for one
    restart per app with secrets.
deprecated_features:
  - >-
    The ``secret_digests`` and ``reconcile_secrets`` filters are deprecated and will be
    removed in 2.0.0. The ``podman_secrets`` module does their work from labels on the
    secrets themselves; the role no longer calls either.
security_fixes:
  - >-
    The ``systemd_app`` role no longer writes ``/var/app/<app>/.secret-digests``, a root-only
    file holding an unsalted SHA-256 of every secret the app declared. A copy of the app's
    directory - a backup, a snapshot - carried a dictionary-attackable digest of each secret;
    the digest now sits as a label beside the secret in podman's own store, where root already
    has the value. An existing record file is removed on the next deploy.
  - >-
    A failed ``podman secret create`` now reports the secret's name, podman's exit code and
    its stderr. Previously the whole task result was censored along with the value, so a
    full store or a permission problem gave the operator nothing to go on.
breaking_changes:
  - >-
    The ``systemd_app`` role now needs podman 4.5 or newer on the host, where
    ``podman secret create`` learned ``--label``; the previous floor was 4.4. Every platform
    the role claims ships podman 5.x.
