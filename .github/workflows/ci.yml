name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Callable, so release.yml runs this gate against the tagged commit rather than
  # trusting a tick from whenever main last ran. The triggers above never fire for a tag.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout collection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # From requirements-dev.txt, into the runner image's own ansible-core venv; the action
      # says why. The pins there are what a contributor installs too.
      - name: Install the development tools
        uses: ./.github/actions/install-dev-tools

      # The role calls community.sops.load_vars, so the lint's own syntax check needs the
      # collection present to resolve it.
      - name: Install the collection's dependencies
        run: ansible-galaxy collection install community.sops

      - name: Unit-test the filter plugins
        run: pytest tests/unit -q

      - name: Lint
        run: ansible-lint

      # CHANGELOG.md is generated from changelogs/changelog.yaml. A fragment that will not
      # parse only fails at release time otherwise, which is the worst moment to find out,
      # and an edit to the generated file would be silently reverted by the next release.
      - name: Lint the changelog
        run: |
          antsibull-changelog lint
          antsibull-changelog lint-changelog-yaml changelogs/changelog.yaml

      - name: Check CHANGELOG.md is in sync with changelog.yaml
        run: |
          antsibull-changelog generate
          if ! git diff --exit-code -- CHANGELOG.md; then
            echo "::error::CHANGELOG.md does not match changelogs/changelog.yaml." \
                 "Run 'antsibull-changelog generate' and commit the result." >&2
            exit 1
          fi

      - name: Build the collection
        run: ansible-galaxy collection build --output-path /tmp/collection-build
