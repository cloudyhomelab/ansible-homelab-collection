# Everything the role is entitled to assume about a host: systemd up, podman working,
# the Quadlet drop-in directory in place, and the fixture image already local.
- name: Prepare
  hosts: all
  become: true
  gather_facts: false

  tasks:
    # Through `raw`, which needs no Python on the target. Every other task in this scenario
    # does, and a target whose interpreter ansible-core cannot drive fails all of them
    # identically, deep in module_utils and saying nothing about the interpreter. Recorded
    # first so the log opens with the two facts that explain that whole class of failure.
    - name: Record the target's release and interpreter
      ansible.builtin.raw: |
        . /etc/os-release && echo "os: $NAME $VERSION_ID"
        python3 -VV
      changed_when: false
      register: molecule_target_python

    - name: Report the target's release and interpreter
      ansible.builtin.debug:
        msg: "{{ molecule_target_python.stdout_lines | map('trim') | select | list }}"

    # Copied out of the scenario so the side-effect play can drop a file from an app's
    # source tree — the way a real app loses one between deploys — without editing a file
    # that is under version control.
    - name: Copy the fixture app tree where a converge may mutate it
      ansible.builtin.copy:
        src: "{{ molecule_fixture_source }}/"
        dest: "{{ molecule_apps_dir }}/"
        mode: "0644"
        directory_mode: "0755"
      delegate_to: localhost
      become: false

    # A scenario that cannot decrypt would otherwise fail deep inside the role, with sops
    # reporting only that it found no identity. Checked here, where the message can say
    # which file was expected and that molecule.yml is what points at it.
    - name: Assert the scenario's age identity is where sops will look for it
      ansible.builtin.assert:
        that:
          - molecule_age_keyfile | length > 0
          - molecule_age_keyfile is exists
        fail_msg: >-
          SOPS_AGE_KEY_FILE is {{ molecule_age_keyfile | default('unset', true) }}, which is
          not a file. It is set in molecule.yml's ansible.env and has to interpolate to
          {{ molecule_fixture_source | dirname }}/sops/age-key.txt.
        quiet: true
      delegate_to: localhost
      become: false
      vars:
        molecule_age_keyfile: "{{ lookup('ansible.builtin.env', 'SOPS_AGE_KEY_FILE') }}"

    # Private files are decrypted on the target, not here, so the target needs the tools.
    # Copied from the controller rather than installed on the target: neither distribution
    # packages sops, and a copy keeps the two ends on one version without a second pinned
    # download and a checksum per architecture. Both are static binaries. The controller
    # already needs sops for the app secrets; age is the scenario's one further tool.
    - name: Look for the decrypt tools on the controller
      ansible.builtin.shell: command -v age && command -v sops
      changed_when: false
      failed_when: false
      delegate_to: localhost
      become: false
      register: molecule_controller_tools

    - name: Assert the controller has age and sops
      ansible.builtin.assert:
        that:
          - molecule_controller_tools.rc == 0
        fail_msg: >-
          This scenario needs both age and sops on the controller: sops to encrypt the
          fixture secrets, age the fixture private files, and both are copied to the target,
          which is where the role's decrypt unit runs them. Install them and re-run.
        quiet: true
      delegate_to: localhost
      become: false

    - name: Install the decrypt tools on the target
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/usr/local/bin/{{ item | basename }}"
        owner: root
        group: root
        mode: "0755"
      loop: "{{ molecule_controller_tools.stdout_lines | map('trim') | select | list }}"

    # The identity the role's shared decrypt unit loads as a systemd credential. The role
    # never provisions it — how a host comes by its key is the fleet's business — so the
    # scenario plays the fleet here, putting the same key sops uses on the controller where
    # the unit's LoadCredential= expects it.
    - name: Create the directory the host keeps its age identity in
      ansible.builtin.file:
        path: /etc/homelab
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Install the host's age identity where the decrypt unit will load it
      ansible.builtin.copy:
        src: "{{ lookup('ansible.builtin.env', 'SOPS_AGE_KEY_FILE') }}"
        dest: /etc/homelab/age.key
        owner: root
        group: root
        mode: "0400"

    # An 'inline' app that ships secrets or private files has a directory holding just
    # those, which is why neither has a counterpart under the scenario's committed apps/
    # tree: git cannot carry an empty directory, and both are written below.
    - name: Create the fixture app directories the copied tree needs
      ansible.builtin.file:
        path: "{{ molecule_apps_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - molsecret
        - molinline
      delegate_to: localhost
      become: false

    # Encrypted here rather than committed: the values are then readable next to the
    # assertions that check them, and a change to one needs no ciphertext regenerated by
    # hand. The role sees exactly what a real app ships — a sops file it must decrypt.
    - name: Encrypt the fixture secrets into the copied tree
      community.sops.sops_encrypt:
        path: "{{ molecule_apps_dir }}/molsecret/secrets.sops.yaml"
        age: ["{{ molecule_sops_recipient }}"]
        content_yaml: "{{ molecule_secrets }}"
        mode: "0600"
      delegate_to: localhost
      become: false

    # The same argument as the secrets above: the plaintext lives in molecule.yml next to
    # the assertions about it, and nothing has to be re-encrypted by hand when it changes.
    # The role sees what a real app ships — files it must copy to the host without reading.
    - name: Create the fixture private directories in the copied tree
      ansible.builtin.file:
        path: "{{ (molecule_apps_dir ~ '/' ~ item.app ~ '/private/' ~ item.path) | dirname }}"
        state: directory
        mode: "0755"
      loop: "{{ molecule_private_files }}"
      loop_control:
        label: "{{ item.app }}/{{ item.path }}"
      delegate_to: localhost
      become: false

    - name: Encrypt the fixture private files with sops
      community.sops.sops_encrypt:
        path: "{{ molecule_apps_dir }}/{{ item.app }}/private/{{ item.path }}"
        age: ["{{ molecule_sops_recipient }}"]
        content_text: "{{ item.content }}"
        mode: "0600"
      loop: "{{ molecule_private_files | selectattr('tool', 'equalto', 'sops') | list }}"
      loop_control:
        label: "{{ item.app }}/{{ item.path }}"
      delegate_to: localhost
      become: false

    # Raw age, which community.sops has no module for: the point of this fixture is that
    # the role handles a file sops never touched.
    - name: Encrypt the fixture private files with age
      ansible.builtin.command:
        argv:
          - age
          - --encrypt
          - --recipient
          - "{{ molecule_sops_recipient }}"
          - --output
          - "{{ molecule_apps_dir }}/{{ item.app }}/private/{{ item.path }}"
        stdin: "{{ item.content }}"
      loop: "{{ molecule_private_files | selectattr('tool', 'equalto', 'age') | list }}"
      loop_control:
        label: "{{ item.app }}/{{ item.path }}"
      changed_when: true
      delegate_to: localhost
      become: false

    # Units the role starts are ordered after basic.target, so a converge racing the
    # boot would see them queued rather than started. 'degraded' is expected and fine:
    # the image masks the units a container cannot run.
    #
    # `raw` rather than the command module, because failed_when: false has to tolerate that
    # exit status and would otherwise also swallow a module that could not run at all —
    # which is exactly what it did once, moving the first visible failure to a later task
    # and hiding that every module on the target was already broken.
    - name: Wait for systemd to finish booting
      ansible.builtin.raw: systemctl is-system-running --wait
      changed_when: false
      failed_when: false

    # Owned by the podman package on a real host, not created by the role — so it is a
    # precondition of the scenario rather than something under test.
    - name: Ensure the Quadlet drop-in directory exists
      ansible.builtin.file:
        path: /etc/containers/systemd
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Pulled here so a registry problem fails the run before the role is under test, and
    # so no unit start below waits on a download.
    - name: Pull the fixture container image
      ansible.builtin.command:
        argv: [podman, pull, "{{ molecule_image }}"]
      changed_when: true
