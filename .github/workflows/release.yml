name: Release

# A published Galaxy version is immutable: it cannot be overwritten and it cannot be
# deleted. A mistake is not rolled back, it is superseded, and the wrong artefact stays
# visible for good. So this workflow spends most of its length refusing to publish — the
# upload itself is one command at the end.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # Two uses. Dispatched from a tag: a release whose gates passed and whose upload then
  # failed, where the tag is already pushed and there is nothing to re-tag. Dispatched from
  # a branch: a rehearsal — every check and every gate runs, the collection is built, and
  # nothing is published. Which one it is comes from the ref, not from an input, so a
  # rehearsal cannot be turned into a release by filling in a form.
  workflow_dispatch:

# Never two uploads of the same tag at once, and never cancel one in flight: a publish
# interrupted between the upload and Galaxy's import is exactly the state with no clean
# recovery.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Seconds, and before the half-hour of gates below: everything here is a way to ship the
  # wrong version, and each is cheaper to catch now than to supersede later.
  verify:
    name: Verify the release is coherent
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}

    steps:
      - name: Checkout collection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag and galaxy.yml are edited at different moments, which is how a collection
      # ends up published under a number nobody meant. The version is read from the file
      # either way, so the tag has to agree with it rather than be believed.
      #
      # This is also where a rehearsal is told apart from a release, and the ref is what
      # tells them apart: a branch has no version to agree with, and everything downstream
      # keys off this rather than off anything a caller can set.
      - name: Resolve the version and check the tag against galaxy.yml
        id: version
        run: |
          declared="$(sed -n 's/^version:[[:space:]]*//p' galaxy.yml | head -1 | tr -d "\"' ")"
          if [ -z "$declared" ]; then
            echo "::error::No version found in galaxy.yml." >&2
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$declared" ]; then
              echo "::error::Tag $GITHUB_REF_NAME says $tag, galaxy.yml says $declared." >&2
              exit 1
            fi
            echo "Releasing $declared from tag $GITHUB_REF_NAME."
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Rehearsal from branch $GITHUB_REF_NAME. Version $declared" \
                 "taken from galaxy.yml, with no tag to check it against. Nothing is published."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"

      # CHANGELOG.md is generated from changelogs/changelog.yaml, so the checks below ask
      # the source of truth rather than the rendered file.
      - name: Install antsibull-changelog
        run: pipx inject ansible-core antsibull-changelog --include-apps

      # Both halves of the record: the fragments still waiting for a release (there should
      # be none by now, but an unparseable one would fail the release step itself) and the
      # changelog they have been folded into.
      - name: Lint the changelog
        run: |
          antsibull-changelog lint
          antsibull-changelog lint-changelog-yaml changelogs/changelog.yaml

      # A version with nothing written about it would publish with an empty release note.
      # Rendering its section is the check: `generate <version>` exits non-zero on a version
      # changelog.yaml does not know, and an entry that renders to nothing is caught here
      # too. The file this produces is thrown away — the publish job renders its own, from
      # the tagged commit.
      - name: Check the changelog describes this version
        run: |
          antsibull-changelog generate "${{ steps.version.outputs.version }}" \
            --only-latest --output /tmp/release-notes-check.md
          if [ ! -s /tmp/release-notes-check.md ]; then
            echo "::error::changelogs/changelog.yaml has no entry for ${{ steps.version.outputs.version }}." >&2
            exit 1
          fi

      # The committed CHANGELOG.md must be the one changelog.yaml renders to. Out of sync
      # means someone edited the generated file, or ran `release` without committing what it
      # regenerated — either way the published changelog would not be the recorded one.
      - name: Check CHANGELOG.md is in sync with changelog.yaml
        run: |
          antsibull-changelog generate
          if ! git diff --exit-code -- CHANGELOG.md; then
            echo "::error::CHANGELOG.md does not match changelogs/changelog.yaml." \
                 "Run 'antsibull-changelog generate' and commit the result." >&2
            exit 1
          fi

      # The publish would fail on a duplicate anyway, but only after the gates have run
      # for half an hour. A 200 here is conclusive; anything else is not, so only 200
      # stops the release — a Galaxy outage should not read as "already published". Worth
      # running in a rehearsal too: it answers whether the number in galaxy.yml is still
      # free, which is the question a rehearsal is usually asked to settle.
      - name: Check the version is not already on Galaxy
        run: |
          url="https://galaxy.ansible.com/api/v3/plugin/ansible/content/published/collections/index"
          url="$url/binarycodes/homelab/versions/${{ steps.version.outputs.version }}/"
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url" || echo 000)"
          case "$code" in
            404) echo "Not yet published." ;;
            200) echo "::error::${{ steps.version.outputs.version }} is already on Galaxy, and a version cannot be replaced." >&2; exit 1 ;;
            *)   echo "::warning::Galaxy answered $code; leaving it to the publish step to refuse a duplicate." ;;
          esac

  # The same definitions main runs, against the tagged commit. Called rather than trusted:
  # a green tick on main is a statement about whatever main was then, and a tag can point
  # anywhere.
  ci:
    name: Gate — unit tests and lint
    needs: verify
    uses: ./.github/workflows/ci.yml

  supported-versions:
    name: Gate — supported versions
    needs: verify
    uses: ./.github/workflows/supported-versions.yml

  molecule:
    name: Gate — molecule
    needs: verify
    uses: ./.github/workflows/molecule.yml

  # Build, upload and announce in one job so the file attached to the GitHub release is
  # byte-for-byte the file that went to Galaxy, rather than a second build of the same
  # source that merely ought to match. On a rehearsal the build still runs and the two
  # steps that change something outside this runner do not.
  publish:
    name: >-
      ${{ needs.verify.outputs.release == 'true' && 'Publish' || 'Rehearse' }}
      ${{ needs.verify.outputs.version }}
    needs: [verify, ci, supported-versions, molecule]
    runs-on: ubuntu-latest

    # The stop button. Configure 'release' in the repository's environments with a required
    # reviewer and this waits for a human between "every gate passed" and the one step that
    # cannot be undone. Without that protection rule the job simply runs, so the guard is
    # only as real as the environment.
    environment: release

    # Only this job writes anything: the release below needs it, and the gates above do not.
    permissions:
      contents: write

    steps:
      - name: Checkout collection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The filename is asserted rather than assumed: it is composed from galaxy.yml's
      # namespace, name and version, and the publish and release steps below both name it.
      # A mismatch here is a build that would not be found a step later, or worse, found
      # and published under a name nobody checked.
      - name: Build the collection
        run: |
          ansible-galaxy collection build --output-path dist
          ls -l "dist/binarycodes-homelab-${{ needs.verify.outputs.version }}.tar.gz"

      # The token reaches the command through the environment, so the secret is never a
      # literal in this file; GitHub masks it in the log either way. No --no-wait: Galaxy
      # accepts the tarball and then imports it asynchronously, and the import is what
      # actually validates the collection, so the run has to stay for the verdict.
      - name: Publish to Galaxy
        if: needs.verify.outputs.release == 'true'
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |
          if [ -z "$GALAXY_API_KEY" ]; then
            echo "::error::Secret GALAXY_API_KEY is not set on this repository." >&2
            exit 1
          fi
          ansible-galaxy collection publish \
            "dist/binarycodes-homelab-${{ needs.verify.outputs.version }}.tar.gz" \
            --api-key "$GALAXY_API_KEY"

      # Rendered from changelogs/changelog.yaml rather than sliced out of CHANGELOG.md:
      # the same command that writes the changelog writes the release body, so the two
      # cannot disagree about where a version's notes end. verify has already established
      # that this version has an entry.
      - name: Install antsibull-changelog
        if: needs.verify.outputs.release == 'true'
        run: pipx inject ansible-core antsibull-changelog --include-apps

      # After the upload, so a failed publish leaves no release announcing a version that
      # is not there.
      - name: Create the GitHub release
        if: needs.verify.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          antsibull-changelog generate "$VERSION" --only-latest --output release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "dist/binarycodes-homelab-$VERSION.tar.gz"

      # A rehearsal is only useful if it says what it did not do. The release notes are
      # rendered here as well, since an empty or wrong-looking body is the one thing the
      # checks above cannot judge for you.
      - name: Install antsibull-changelog for the rehearsal notes
        if: needs.verify.outputs.release != 'true'
        run: pipx inject ansible-core antsibull-changelog --include-apps

      - name: Report what a release would have done
        if: needs.verify.outputs.release != 'true'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          antsibull-changelog generate "$VERSION" --only-latest --output release-notes.md
          {
            echo "## Rehearsal of $VERSION"
            echo
            echo "Ran from \`$GITHUB_REF_NAME\`, which is a branch, so nothing was published."
            echo "Every check and every gate ran, and the collection built:"
            echo
            echo '```'
            tar tzf "dist/binarycodes-homelab-$VERSION.tar.gz" | head -20
            echo '```'
            echo
            echo "A \`v$VERSION\` tag would additionally have uploaded that file to Galaxy"
            echo "and opened a GitHub release with these notes:"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
